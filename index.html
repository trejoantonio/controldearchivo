<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribunal Laboral Burocrático de Durango - Control de Expedientes Ponencia 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        durango: {
                            silver: '#e2e8f0',
                            platino: '#f8fafc',
                            burgundy: '#800020',
                            gold: '#c5a059',
                            dark: '#0f172a',
                            slate: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        .silver-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
        }
        .platino-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
        }
        .legal-seal {
            border: 2px solid #c5a059;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-white">

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-2xl w-full border border-slate-200 overflow-hidden transform transition-all"></div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        // GLOBAL INITIAL DATA & STORAGE LOGIC
        const AREAS = [
            'Oficialía',
            'Secretaría de Acuerdos',
            'Secretaría de Proyectos',
            'Actuaría',
            'Amparo Indirecto',
            'Amparo Directo',
            'Oficina del Juez',
            'Archivo'
        ];

        const ROLES = [
            { id: 'Juez', name: 'Juez Supervisor' },
            { id: 'Secretaria_Acuerdos', name: 'Secretaria de Acuerdos' },
            { id: 'Oficial', name: 'Oficial Judicial' },
            { id: 'Proyectista', name: 'Secretario de Proyectos' },
            { id: 'Actuario', name: 'Actuario Notificador' },
            { id: 'Encargado_Amparo', name: 'Encargado de Área de Amparo' },
            { id: 'Archivista', name: 'Encargado de Archivo' },
            { id: 'Administrador', name: 'Administrador General' }
        ];

        const DEFAULT_USERS = [
            { id: 'u1', name: 'Mtro. Juez Ponencia 3', email: 'juez3@tribunallaboraldurango.gob.mx', username: 'Juez3', password: '123', area: 'Oficina del Juez', role: 'Juez', status: 'Activo', fechaAlta: '2026-01-10' },
            { id: 'u2', name: 'Admin General', email: 'admin@tribunallaboraldurango.gob.mx', username: 'Admin', password: '662666', area: 'Oficina del Juez', role: 'Administrador', status: 'Activo', fechaAlta: '2026-01-01' },
            { id: 'u3', name: 'Lic. María Elena Torres', email: 'acuerdos@tribunallaboraldurango.gob.mx', username: 'SecretariaAcuerdos', password: '123', area: 'Secretaría de Acuerdos', role: 'Secretaria_Acuerdos', status: 'Activo', fechaAlta: '2026-01-12' },
            { id: 'u4', name: 'Lic. Roberto Gómez', email: 'actuaria@tribunallaboraldurango.gob.mx', username: 'Actuario1', password: '123', area: 'Actuaría', role: 'Actuario', status: 'Activo', fechaAlta: '2026-01-15' },
            { id: 'u5', name: 'Lic. Sofía Mendoza', email: 'amparo.ind@tribunallaboraldurango.gob.mx', username: 'AmparoInd', password: '123', area: 'Amparo Indirecto', role: 'Encargado_Amparo', status: 'Activo', fechaAlta: '2026-01-20' },
            { id: 'u6', name: 'Carlos Delgado', email: 'archivo@tribunallaboraldurango.gob.mx', username: 'Archivo1', password: '123', area: 'Archivo', role: 'Archivista', status: 'Activo', fechaAlta: '2026-02-01' },
            { id: 'u7', name: 'Lic. Gabriel Ramírez', email: 'proyectos@tribunallaboraldurango.gob.mx', username: 'Proyectista1', password: '123', area: 'Secretaría de Proyectos', role: 'Proyectista', status: 'Activo', fechaAlta: '2026-02-05' }
        ];

        const DEFAULT_EXPEDIENTES = [
            {
                id: 'exp-001',
                numero: '124/2026-P3',
                juicio: 'Ordinario Laboral Burocrático',
                actor: 'Juan Carlos Morales',
                demandado: 'Secretaría de Educación del Estado de Durango',
                areaActual: 'Secretaría de Acuerdos',
                estadoRecepcion: 'Aceptado', // 'Pendiente_Aceptacion', 'Aceptado'
                fechaTurno: '2026-03-01 09:30',
                tareaPendiente: 'Revisión e integración de promoción inicial',
                historial: [
                    { fecha: '2026-03-01 09:00', usuario: 'Lic. María Elena Torres', area: 'Oficialía', accion: 'Radicación de Expediente e ingreso de promoción inicial.' },
                    { fecha: '2026-03-01 09:30', usuario: 'Lic. María Elena Torres', area: 'Secretaría de Acuerdos', accion: 'Aceptación física e inicio de trámite.' }
                ]
            },
            {
                id: 'exp-002',
                numero: '089/2026-P3',
                juicio: 'Juicio de Amparo Indirecto 452/2026',
                actor: 'Martha Patricia Ríos',
                demandado: 'Ayuntamiento de Durango',
                areaActual: 'Oficina del Juez',
                estadoRecepcion: 'Pendiente_Aceptacion',
                fechaTurno: '2026-03-02 11:15',
                tareaPendiente: 'Firma de Acuerdo y Turno a Notificación',
                historial: [
                    { fecha: '2026-02-28 10:00', usuario: 'Lic. Sofía Mendoza', area: 'Amparo Indirecto', accion: 'Promoción de amparo promovida e ingresada.' },
                    { fecha: '2026-03-02 11:15', usuario: 'Lic. Sofía Mendoza', area: 'Oficina del Juez', accion: 'Turnado al Juez para revisión de resolución preliminar.' }
                ]
            }
        ];

        // LOAD PERSISTED OR DEFAULT STATE
        let users = JSON.parse(localStorage.getItem('tld_users')) || DEFAULT_USERS;
        let expedientes = JSON.parse(localStorage.getItem('tld_expedientes')) || DEFAULT_EXPEDIENTES;
        let currentUser = JSON.parse(localStorage.getItem('tld_current_user')) || null;

        function saveState() {
            localStorage.setItem('tld_users', JSON.stringify(users));
            localStorage.setItem('tld_expedientes', JSON.stringify(expedientes));
            localStorage.setItem('tld_current_user', JSON.stringify(currentUser));
        }

        // TOAST NOTIFICATIONS
        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-700' : type === 'error' ? 'bg-rose-700' : 'bg-slate-800';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-xl text-sm flex items-center space-x-3 transition-all duration-300 transform translate-y-2 pointer-events-auto border border-amber-500/30`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-5 h-5 text-amber-400"></i>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // MODAL HELPERS
        function openModal(contentHtml) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = contentHtml;
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
        }

        // APP CONTROLLER
        const app = {
            init: function() {
                if (currentUser) {
                    this.renderDashboard();
                } else {
                    this.renderLogin();
                }
            },

            navigate: function(view) {
                if (!currentUser && view !== 'login' && view !== 'register') {
                    this.renderLogin();
                    return;
                }
                if (view === 'dashboard') this.renderDashboard();
                else if (view === 'users') this.renderAdminPanel();
                else if (view === 'profile') this.renderProfileModal();
            },

            // --- HEADER COMPONENT WITH INSTITUTIONAL SILVER DESIGN ---
            getHeaderHtml: function() {
                const pendingUsersCount = users.filter(u => u.status === 'Pendiente').length;
                const isJudge = currentUser && (currentUser.role === 'Juez' || currentUser.role === 'Administrador');

                return `
                    <header class="silver-gradient text-white shadow-xl border-b border-amber-500/30 sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigate('dashboard')">
                                    <div class="w-12 h-12 bg-slate-900 border-2 border-amber-500/80 rounded-full flex items-center justify-center shadow-md">
                                        <i data-lucide="scale" class="w-6 h-6 text-amber-400"></i>
                                    </div>
                                    <div>
                                        <h1 class="font-serif font-bold text-lg md:text-xl tracking-wider text-amber-100 uppercase">
                                            Tribunal Laboral Burocrático del Estado de Durango
                                        </h1>
                                        <p class="text-xs text-slate-300 font-medium flex items-center gap-2">
                                            <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wider">Ponencia Número Tres</span>
                                            <span>• Control Digital de Expedientes</span>
                                        </p>
                                    </div>
                                </div>

                                ${currentUser ? `
                                    <div class="flex items-center space-x-3 text-xs">
                                        ${isJudge && pendingUsersCount > 0 ? `
                                            <button onclick="app.renderAdminPanel()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 shadow-md animate-pulse">
                                                <i data-lucide="user-plus" class="w-4 h-4"></i>
                                                <span>Aprobar Usuarios (${pendingUsersCount})</span>
                                            </button>
                                        ` : ''}

                                        <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-right">
                                            <div class="font-bold text-amber-300">${currentUser.name}</div>
                                            <div class="text-slate-400 text-[11px]">${currentUser.area} (${currentUser.role})</div>
                                        </div>

                                        <button onclick="app.renderProfileModal()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 hover:text-white" title="Mi Perfil / Clave">
                                            <i data-lucide="key-round" class="w-4 h-4"></i>
                                        </button>

                                        ${currentUser.role === 'Administrador' ? `
                                            <button onclick="app.renderAdminPanel()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 hover:text-white" title="Administrar Usuarios">
                                                <i data-lucide="users" class="w-4 h-4"></i>
                                            </button>
                                        ` : ''}

                                        <button onclick="app.logout()" class="p-2 bg-rose-900/80 hover:bg-rose-800 border border-rose-700 rounded-lg text-rose-200" title="Cerrar Sesión">
                                            <i data-lucide="log-out" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </header>
                `;
            },

            // --- AUTHENTICATION: LOGIN & REGISTER ---
            renderLogin: function() {
                const appDiv = document.getElementById('app');
                appDiv.innerHTML = `
                    ${this.getHeaderHtml()}
                    <div class="flex-1 flex items-center justify-center p-6 bg-slate-200">
                        <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-slate-300 overflow-hidden">
                            <div class="silver-gradient p-6 text-center border-b border-amber-500/40">
                                <div class="w-16 h-16 bg-slate-900 border-2 border-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                                    <i data-lucide="shield-check" class="w-8 h-8 text-amber-400"></i>
                                </div>
                                <h2 class="font-serif text-xl font-bold text-amber-100">Acceso Institucional</h2>
                                <p class="text-xs text-slate-300 mt-1">Ponencia N° 3 • Tribunal Laboral Burocrático</p>
                            </div>

                            <form onsubmit="app.handleLogin(event)" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario</label>
                                    <div class="relative">
                                        <i data-lucide="user" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input type="text" id="login-username" required placeholder="Nombre de usuario" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                                    <div class="relative">
                                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    </div>
                                </div>

                                <button type="submit" class="w-full silver-gradient text-white font-bold py-2.5 rounded-lg text-sm shadow-md hover:brightness-110 border border-amber-500/30 flex items-center justify-center space-x-2">
                                    <i data-lucide="log-in" class="w-4 h-4 text-amber-400"></i>
                                    <span>Ingresar al Sistema</span>
                                </button>

                                <div class="text-center pt-4 border-t border-slate-200">
                                    <p class="text-xs text-slate-600">¿No tienes cuenta de acceso?</p>
                                    <button type="button" onclick="app.renderRegisterModal()" class="text-amber-700 font-bold hover:underline text-xs mt-1">
                                        Registrar Solicitud de Usuario
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },

            handleLogin: function(e) {
                e.preventDefault();
                const u = document.getElementById('login-username').value.trim();
                const p = document.getElementById('login-password').value.trim();

                const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);

                if (!user) {
                    showAlert('Usuario o contraseña incorrectos.', 'error');
                    return;
                }

                if (user.status === 'Pendiente') {
                    showAlert('Tu usuario aún no ha sido autorizado por el Juez.', 'error');
                    return;
                }

                currentUser = user;
                saveState();
                showAlert(`Bienvenido/a, ${user.name}`, 'success');
                this.renderDashboard();
            },

            logout: function() {
                currentUser = null;
                saveState();
                showAlert('Sesión cerrada correctamente.');
                this.renderLogin();
            },

            // --- REGISTRATION REQUEST MODAL ---
            renderRegisterModal: function() {
                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <h3 class="font-bold text-sm flex items-center space-x-2">
                            <i data-lucide="user-plus" class="w-4 h-4 text-amber-400"></i>
                            <span>Registro de Usuario - Solicitar Alta</span>
                        </h3>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form onsubmit="app.handleRegisterSubmit(event)" class="p-6 space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo</label>
                                <input type="text" id="reg-name" required placeholder="Ej. Lic. Roberto Gómez" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label>
                                <input type="email" id="reg-email" required placeholder="correo@ejemplo.gob.mx" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nombre de Usuario</label>
                                <input type="text" id="reg-username" required placeholder="UsuarioAcceso" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
                                <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Área de Trabajo</label>
                                <select id="reg-area" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    ${AREAS.map(a => `<option value="${a}">${a}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Puesto / Cargo</label>
                                <select id="reg-role" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    ${ROLES.filter(r => r.id !== 'Juez' && r.id !== 'Administrador').map(r => `<option value="${r.id}">${r.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg text-xs flex items-start space-x-2">
                            <i data-lucide="info" class="w-4 h-4 text-amber-600 mt-0.5 flex-shrink-0"></i>
                            <p>Toda solicitud de alta queda en estado pendiente hasta ser validada por el Juez titular de la Ponencia Tres.</p>
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-amber-300 font-bold rounded-lg text-sm shadow">Enviar Solicitud</button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            handleRegisterSubmit: function(e) {
                e.preventDefault();
                const username = document.getElementById('reg-username').value.trim();

                if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                    showAlert('El nombre de usuario ya se encuentra registrado.', 'error');
                    return;
                }

                const newUser = {
                    id: 'u-' + Date.now(),
                    name: document.getElementById('reg-name').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    username: username,
                    password: document.getElementById('reg-password').value.trim(),
                    area: document.getElementById('reg-area').value,
                    role: document.getElementById('reg-role').value,
                    status: 'Pendiente',
                    fechaAlta: new Date().toISOString().split('T')[0]
                };

                users.push(newUser);
                saveState();
                closeModal();
                showAlert('Solicitud enviada exitosamente. El Juez revisará tu alta.', 'success');
            },

            // --- PROFILE & PASSWORD CHANGE MODAL ---
            renderProfileModal: function() {
                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <h3 class="font-bold text-sm flex items-center space-x-2">
                            <i data-lucide="user-check" class="w-4 h-4 text-amber-400"></i>
                            <span>Mi Perfil y Cambio de Contraseña</span>
                        </h3>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form onsubmit="app.handleUpdateProfile(event)" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo</label>
                            <input type="text" id="prof-name" value="${currentUser.name}" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico</label>
                            <input type="email" id="prof-email" value="${currentUser.email}" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Nueva Contraseña</label>
                            <input type="password" id="prof-password" value="${currentUser.password}" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm shadow">Guardar Cambios</button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            handleUpdateProfile: function(e) {
                e.preventDefault();
                currentUser.name = document.getElementById('prof-name').value.trim();
                currentUser.email = document.getElementById('prof-email').value.trim();
                currentUser.password = document.getElementById('prof-password').value.trim();

                const idx = users.findIndex(u => u.id === currentUser.id);
                if (idx !== -1) users[idx] = currentUser;

                saveState();
                closeModal();
                showAlert('Perfil y contraseña actualizados correctamente.', 'success');
                this.renderDashboard();
            },

            // --- ADMIN & JUDGE AUTHORIZATION PANEL ---
            renderAdminPanel: function() {
                const appDiv = document.getElementById('app');
                const pendingUsers = users.filter(u => u.status === 'Pendiente');
                const activeUsers = users.filter(u => u.status === 'Activo');

                appDiv.innerHTML = `
                    ${this.getHeaderHtml()}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-300 pb-4">
                            <div>
                                <h2 class="text-xl font-serif font-bold text-slate-900 flex items-center gap-2">
                                    <i data-lucide="shield-alert" class="w-6 h-6 text-amber-600"></i>

            renderExpedientesRows: function(list) {
                if (list.length === 0) {

                const isJudge = currentUser.role === 'Juez';
                const isAdmin = currentUser.role === 'Administrador';

                return list.map(e => {
                    const canAccept = e.areaActual === currentUser.area && e.estadoRecepcion === 'Pendiente_Aceptacion';
                    const isAcceptedInArea = e.areaActual === currentUser.area && e.estadoRecepcion === 'Aceptado';

                    return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3 font-bold text-slate-900 font-mono">${e.numero}</td>

                            <td class="p-3">
                                <span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${e.areaActual === 'Oficina del Juez' ? 'bg-amber-100 text-amber-900 border-amber-300' : 'bg-slate-100 text-slate-800 border-slate-300'}">

                                </span>

                                        <i data-lucide="check" class="w-3 h-3"></i> Aceptado
                                    </span>
                                ` : `
                                    <span class="px-2 py-0.5 bg-amber-100 text-amber-800 border border-amber-300 rounded text-[10px] font-bold flex items-center w-max gap-1 animate-pulse">

                                    </span>

                            <td class="p-3 text-slate-600 max-w-xs truncate">${e.tareaPendiente}</td>

                                        Eliminar
                                    </button>
                                ` : ''}
                            </td>

            handleSaveNuevoExpediente: function(e) {
                e.preventDefault();
                const now = new Date().toLocaleString('es-MX');

                const newExp = {
                    id: 'exp-' + Date.now(),
                    numero: document.getElementById('exp-numero').value.trim(),
                    juicio: document.getElementById('exp-juicio').value.trim(),
                    actor: document.getElementById('exp-actor').value.trim(),
                    demandado: document.getElementById('exp-demandado').value.trim(),
                    areaActual: currentUser.area,
                    estadoRecepcion: 'Aceptado',
                    fechaTurno: now,
                    tareaPendiente: document.getElementById('exp-tarea').value.trim(),
                    historial: [
                        {
                            fecha: now,
                            usuario: currentUser.name,
                            area: currentUser.area,
                            accion: `Alta de expediente e ingreso de promoción inicial: ${document.getElementById('exp-tarea').value.trim()}`
                        }
                    ]
                };

                expedientes.unshift(newExp);
                saveState();
                closeModal();
                showAlert('Expediente registrado en la base de datos.', 'success');
                this.renderDashboard();
            },

            // --- ACEPTAR RECEPCIÓN DE EXPEDIENTE ---
            aceptarRecepcionExpediente: function(id) {
                const exp = expedientes.find(e => e.id === id);
                if (exp) {
                    const now = new Date().toLocaleString('es-MX');
                    exp.estadoRecepcion = 'Aceptado';
                    exp.historial.push({
                        fecha: now,
                        usuario: currentUser.name,
                        area: currentUser.area,
                        accion: `Recepción y aceptación física del expediente en el área de ${currentUser.area}.`
                    });
                    saveState();
                    showAlert(`Expediente ${exp.numero} recibido correctamente en ${currentUser.area}.`, 'success');
                    this.renderDashboard();
                }
            },

            // --- TURNAR EXPEDIENTE ---
            renderTurnarExpedienteModal: function(id) {
                const exp = expedientes.find(e => e.id === id);
                if (!exp) return;

                const isJudge = currentUser.role === 'Juez';

                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <h3 class="font-bold text-sm flex items-center space-x-2">
                            <i data-lucide="send" class="w-4 h-4 text-amber-400"></i>
                            <span>Turnar Expediente N° ${exp.numero}</span>
                        </h3>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form onsubmit="app.handleSaveTurno(event, '${exp.id}')" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Área Destino de Turno</label>
                            <select id="turno-area" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                                ${AREAS.filter(a => a !== exp.areaActual).map(a => `<option value="${a}">${a}</option>`).join('')}
                            </select>
                        </div>

                        ${isJudge ? `
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Instrucción / Tarea del Juez</label>
                                <select id="turno-tarea-preset" onchange="document.getElementById('turno-tarea').value = this.value" class="w-full px-3 py-2 border rounded-lg text-sm mb-2">
                                    <option value="">Seleccionar instrucción predefinida...</option>
                                    <option value="Notificación personal a las partes">Notificación personal</option>
                                    <option value="Visita de inspección ocular">Visita de inspección</option>
                                    <option value="Diligencia de ejecución de laudo">Diligencia de ejecución</option>
                                    <option value="Emplazamiento a juicio">Emplazamiento</option>
                                    <option value="Turnar a elaboración de Proyecto de Laudo / Resolución">Turnar a Proyectos</option>
                                    <option value="Atención a juicio de amparo">Trámite de Amparo</option>
                                    <option value="Enviar a Archivo por conclusión de trámite">Enviar a Archivo</option>
                                </select>
                            </div>
                        ` : ''}

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Detalle de la Tarea / Observación</label>
                            <textarea id="turno-tarea" required rows="3" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500" placeholder="Especifique el acuerdo, resolución o instrucción al turnar..."></textarea>
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm shadow">Confirmar Turno</button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            handleSaveTurno: function(e, id) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const areaDestino = document.getElementById('turno-area').value;
                const tarea = document.getElementById('turno-tarea').value.trim();
                const now = new Date().toLocaleString('es-MX');

                exp.areaActual = areaDestino;
                exp.estadoRecepcion = 'Pendiente_Aceptacion';
                exp.fechaTurno = now;
                exp.tareaPendiente = tarea;

                exp.historial.unshift({
                    fecha: now,
                    usuario: currentUser.name,
                    area: currentUser.area,
                    accion: `Turnado a [${areaDestino}]. Indicación: ${tarea}`
                });

                saveState();
                closeModal();
                showAlert(`Expediente turnado a ${areaDestino}.`, 'success');
                this.renderDashboard();
            },

            // --- VER HISTORIAL Y TRAZABILIDAD ---
            verDetalleExpediente: function(id) {
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <div>
                            <h3 class="font-bold text-base font-serif">${exp.numero}</h3>
                            <p class="text-xs text-amber-300 font-sans">${exp.juicio}</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
                            <div><span class="font-bold text-slate-700">Actor:</span> ${exp.actor}</div>
                            <div><span class="font-bold text-slate-700">Demandado:</span> ${exp.demandado}</div>
                            <div><span class="font-bold text-slate-700">Ubicación Actual:</span> <span class="text-amber-700 font-bold">${exp.areaActual}</span></div>
                            <div><span class="font-bold text-slate-700">Estatus:</span> ${exp.estadoRecepcion}</div>
                        </div>

                        <div>
                            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-700 mb-3 border-b pb-1">Trazabilidad e Historial del Expediente</h4>
                            <div class="space-y-3 relative pl-4 border-l-2 border-slate-300">
                                ${exp.historial.map(h => `
                                    <div class="relative group">
                                        <div class="w-2.5 h-2.5 bg-amber-500 rounded-full absolute -left-[21px] top-1 border border-white"></div>
                                        <div class="text-[11px] text-slate-500 font-semibold">${h.fecha} • <span class="text-slate-800 font-bold">${h.usuario}</span> (${h.area})</div>
                                        <div class="text-xs text-slate-700 mt-0.5 bg-slate-100 p-2 rounded border border-slate-200">${h.accion}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-slate-100 text-right border-t">
                        <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-800 text-white rounded text-xs font-bold">Cerrar</button>
                    </div>
                `;
                openModal(html);
            }
        };

        // RUN APPLICATION ON LOAD
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>

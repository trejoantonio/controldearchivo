    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "",
            authDomain: "",
            projectId: "default-project",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tb-ponencia3-app';

        let appFirebase = null;
        let db = null;
        let auth = null;

        if (firebaseConfig.projectId && firebaseConfig.projectId !== "default-project") {
            try {
                appFirebase = initializeApp(firebaseConfig);
                db = getFirestore(appFirebase);
                auth = getAuth(appFirebase);

                // Authentication init with fallback to anonymous authentication
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                // Attach strict path helpers as mandated by storage instructions:
                // Mandatory Path: /artifacts/{appId}/public/data/{collectionName}
                window.firebaseDb = db;
                window.firebaseAuth = auth;
                window.firebaseAppId = appId;
                window.firestoreCollections = {
                    publicData: (coll) => collection(db, 'artifacts', appId, 'public', 'data', coll),
                    publicDoc: (coll, id) => doc(db, 'artifacts', appId, 'public', 'data', coll, id)
                };

                console.log("Firebase initialized successfully with online Firestore paths.");
            } catch (err) {
                console.warn("Firebase initialization skipped or failed, falling back to local storage:", err);
            }
        }
    </script>

    <script>
        function openModal(content) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = content;
            modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
        }

        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const bgColors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                danger: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-950 border-amber-400 font-semibold',
                info: 'bg-slate-800 text-slate-100 border-slate-600'
            };

            const icons = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                warning: 'alert-circle',
                info: 'info'
            };

            const toast = document.createElement('div');
            toast.className = `p-3 rounded-lg shadow-xl border ${bgColors[type] || bgColors.info} text-xs flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
                    <span>${msg}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-xs opacity-70 hover:opacity-100 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            `;

            container.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.remove();
                }
            }, 4000);
        }

        const app = {

            expedientes: [],

            users: [],
            auditLogs: [],

                serviceId: '',

            init: function() {

                    this.renderLogin();

                        <div class="max-w-md w-full space-y-6 bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-2xl text-slate-100">

                                        <input type="text" id="login_username" class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-slate-500" placeholder="Ej. Admin" required>
                                    </div>
                                </div>

                                    <div class="relative">
                                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
                                        <input type="password" id="login_password" class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-slate-500" placeholder="••••••••" required>

            handleLoginSubmit: function(e) {
                e.preventDefault();
                const usernameInput = document.getElementById('login_username').value.trim();
                const passwordInput = document.getElementById('login_password').value.trim();

                const user = this.users.find(u => u.username.toLowerCase() === usernameInput.toLowerCase() && u.passwordHash === passwordInput);

                if (!user) {
                    showAlert('Usuario o contraseña incorrectos.', 'danger');
                    return;
                }

                if (user.status !== 'aprobado') {
                    showAlert('Tu cuenta se encuentra pendiente de aprobación por el Administrador General.', 'warning');
                    return;
                }

                this.currentUser = user;
                if (user.role === 'Admin' && !user.activeSimulatedRole) {
                    this.currentUser.activeSimulatedRole = 'Administrador General';
                }

                localStorage.setItem('tb_session', JSON.stringify(this.currentUser));
                this.logAudit('Inicio de Sesión', `Usuario ${user.username} ingresó al sistema.`);
                showAlert(`Bienvenido, ${user.name}`, 'success');
                this.renderDashboard();
            },

            logout: function() {
                if (this.currentUser) {
                    this.logAudit('Cierre de Sesión', `Usuario ${this.currentUser.username} cerró sesión.`);
                }
                this.currentUser = null;
                localStorage.removeItem('tb_session');
                showAlert('Sesión cerrada correctamente.', 'info');
                this.renderLogin();
            },

            initFirebaseSync: function() {
                if (window.firebaseDb && window.firestoreCollections) {
                    try {
                        const expCol = window.firestoreCollections.publicData('expedientes');
                        const reportsCol = window.firestoreCollections.publicData('reportes_entrega');
                        const logsCol = window.firestoreCollections.publicData('audit_logs');

                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ onSnapshot }) => {
                            // Realtime snapshot listener for Expedientes
                            onSnapshot(expCol, (snapshot) => {
                                if (!snapshot.empty) {
                                    const remoteExps = [];
                                    snapshot.forEach(doc => remoteExps.push({ id: doc.id, ...doc.data() }));
                                    if (remoteExps.length > 0) {
                                        this.expedientes = remoteExps;
                                        localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                                        if (this.activeTab === 'dashboard') this.filterExpedientesTable();
                                    }
                                }
                            }, (err) => console.warn("Firestore Expedientes sync error:", err));

                            // Realtime snapshot listener for Reportes de Entrega
                            onSnapshot(reportsCol, (snapshot) => {
                                if (!snapshot.empty) {
                                    const remoteReports = [];
                                    snapshot.forEach(doc => remoteReports.push({ id: doc.id, ...doc.data() }));
                                    if (remoteReports.length > 0) {
                                        this.reportesEntrega = remoteReports;
                                        localStorage.setItem('tb_reportes_entrega', JSON.stringify(this.reportesEntrega));
                                    }
                                }
                            }, (err) => console.warn("Firestore Reports sync error:", err));

                            // Realtime snapshot listener for Audit Logs
                            onSnapshot(logsCol, (snapshot) => {
                                if (!snapshot.empty) {
                                    const remoteLogs = [];
                                    snapshot.forEach(doc => remoteLogs.push({ id: doc.id, ...doc.data() }));
                                    if (remoteLogs.length > 0) {
                                        this.auditLogs = remoteLogs;
                                        localStorage.setItem('tb_audit_logs', JSON.stringify(this.auditLogs));
                                    }
                                }
                            }, (err) => console.warn("Firestore Logs sync error:", err));
                        });
                    } catch(e) {
                        console.warn("Realtime listener setup exception:", e);
                    }
                }
            },
<!-- ... existing code ... background log persistence -->
            logAudit: function(accion, detalles) {
                const user = this.currentUser || { name: 'Sistema', role: 'General' };
                const log = {
                    id: 'log-' + Date.now().toString(36),
                    fecha: new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX'),
                    usuario: user.name,
                    role: user.role,
                    accion,
                    detalles
                };
                this.auditLogs.unshift(log);
                localStorage.setItem('tb_audit_logs', JSON.stringify(this.auditLogs));

                if (window.firebaseDb && window.firestoreCollections) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc }) => {
                        const docRef = window.firestoreCollections.publicDoc('audit_logs', log.id);
                        setDoc(docRef, log).catch(err => console.warn("Firestore log save fallback:", err));
                    });
                }
            },

                if (!this.currentUser || this.currentUser.role !== 'Admin') return;
                this.currentUser.activeSimulatedRole = roleName;
                localStorage.setItem('tb_session', JSON.stringify(this.currentUser));
                this.logAudit('Prueba de Sistema', `Admin cambió su área activa simulada a: ${roleName}`);

            handleNewExpedienteSubmit: function(e) {
                e.preventDefault();
                const prefix = document.getElementById('exp_prefix').value;
                const consecutivo = document.getElementById('exp_consecutivo').value.trim();
                const anio = document.getElementById('exp_anio').value;

                const fullNumber = `${prefix}/${consecutivo.padStart(3, '0')}/${anio}`;

                if (this.expedientes.some(exp => exp.numero === fullNumber)) {
                    showAlert(`El número de expediente ${fullNumber} ya se encuentra registrado.`, 'danger');
                    return;
                }

                const actorNombre = document.getElementById('actor_nombre').value.trim();
                const actorPaterno = document.getElementById('actor_paterno').value.trim();
                const actorMaterno = document.getElementById('actor_materno').value.trim();
                const fullActor = `${actorNombre} ${actorPaterno} ${actorMaterno}`.trim();

                const demandado = document.getElementById('exp_demandado').value.trim();
                const juicio = document.getElementById('exp_juicio_tipo').value;
                const tarea = document.getElementById('exp_tarea').value.trim();
                const encargado = document.getElementById('exp_encargado').value;

                let vinculado = document.getElementById('exp_vinculado').value.trim();
                const desvincular = document.getElementById('chk_desvincular').checked;
                if (desvincular) vinculado = '';

                const nowStr = new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX');

                const newExp = {
                    id: 'exp-' + Date.now().toString(36),
                    prefix,
                    consecutivo,
                    anio,
                    numero: fullNumber,
                    actorNombre,
                    actorPaterno,
                    actorMaterno,
                    actor: fullActor,
                    demandado,
                    juicio,
                    tarea,
                    encargado,
                    fechaRegistro: nowStr,
                    expedienteVinculado: vinculado,
                    historial: [{
                        fecha: nowStr,
                        usuario: this.currentUser ? this.currentUser.name : 'Admin',
                        area: encargado,
                        accion: `Registro inicial del expediente`
                    }]
                };

                this.expedientes.unshift(newExp);
                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));

                if (window.firebaseDb && window.firestoreCollections) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc }) => {
                        const docRef = window.firestoreCollections.publicDoc('expedientes', newExp.id);
                        setDoc(docRef, newExp).catch(err => console.warn("Firestore save fallback:", err));
                    });
                }

                this.logAudit('Registro Expediente', `Alta de ${fullNumber}`);
                showAlert(`Expediente ${fullNumber} registrado exitosamente.`, 'success');
                closeModal();
                this.renderDashboard();
            },

            filterExpedientesTable: function() {
                const tbody = document.getElementById('expedientes_tbody');
                if (!tbody) return;

                const q = document.getElementById('exp_search')?.value.toLowerCase().trim() || '';
                const area = document.getElementById('filter_encargado')?.value || '';

                // Filter matching query & area
                const filtered = this.expedientes.filter(e => {
                    const matchQ = !q || e.numero.toLowerCase().includes(q) || e.actor.toLowerCase().includes(q) || e.demandado.toLowerCase().includes(q);
                    const matchArea = !area || e.encargado === area;
                    return matchQ && matchArea;
                });

                // Sort: 1. Year descending (most recent first), 2. Consecutivo descending
                filtered.sort((a, b) => {
                    const yearA = parseInt(a.anio || (a.numero.split('/')[2] || '0'), 10);
                    const yearB = parseInt(b.anio || (b.numero.split('/')[2] || '0'), 10);

                    if (yearB !== yearA) {
                        return yearB - yearA; // Most recent year first
                    }

                    const numA = parseInt(a.consecutivo || (a.numero.split('/')[1] || '0'), 10);
                    const numB = parseInt(b.consecutivo || (b.numero.split('/')[1] || '0'), 10);

                    return numB - numA; // Higher consecutivo first within same year
                });

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">No se encontraron expedientes.</td></tr>`;
                    return;
                }

                tbody.innerHTML = filtered.map(e => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3 font-mono font-bold text-slate-900">${e.numero}</td>
                        <td class="p-3 font-semibold text-slate-800">${e.actor}</td>

            executeTurnoExpediente: function(expId) {
                const chk1 = document.getElementById('chk_presencia')?.checked;
                const chk2 = document.getElementById('chk_folios')?.checked;

                if (!chk1 || !chk2) {
                    showAlert('Debe confirmar las casillas de verificación física.', 'warning');
                    return;
                }

                const exp = this.expedientes.find(e => e.id === expId);
                if (!exp) return;

                const nuevaArea = document.getElementById('turno_area').value;
                const nuevaTarea = document.getElementById('turno_tarea').value.trim();
                const nowStr = new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX');

                exp.encargado = nuevaArea;
                exp.tarea = nuevaTarea;

                const nuevoReporte = {
                    id: 'rep-' + Date.now().toString(36),
                    fecha: nowStr,
                    expediente: exp.numero,
                    entregadoPor: this.currentUser.name,
                    recibidoPor: nuevaArea,
                    estadoFisico: 'Verificado Físicamente'
                };

                this.reportesEntrega.unshift(nuevoReporte);

                localStorage.setItem('tb_reportes_entrega', JSON.stringify(this.reportesEntrega));
                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));

                // Sync Expediente and Delivery Report online via Firestore
                if (window.firebaseDb && window.firestoreCollections) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc, updateDoc }) => {
                        const expDocRef = window.firestoreCollections.publicDoc('expedientes', exp.id);
                        const repDocRef = window.firestoreCollections.publicDoc('reportes_entrega', nuevoReporte.id);
                        
                        setDoc(expDocRef, exp, { merge: true }).catch(err => console.warn("Firestore exp update fallback:", err));
                        setDoc(repDocRef, nuevoReporte).catch(err => console.warn("Firestore report save fallback:", err));
                    });
                }

                this.logAudit('Custodia', `${exp.numero} asignado a ${nuevaArea}`);

                showAlert('Custodia actualizada correctamente en la nube.', 'success');
                closeModal();
                this.renderDashboard();
            },

                const row2 = "PE,012,2026,Rosa,Martínez,Soto,Municipio de Durango,Procedimiento Especial,Secretaría de Acuerdos de Trámite / Ejecución,Auto de admisión\n";
                const row3 = "CONVENIO,005,2026,José,Rodríguez,Mendoza,SICT,Convenio Conciliatorio,Mesa de Conciliación y Convenios,Ratificación de convenio\n";

                const blob = new Blob([header + row1 + row2 + row3], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');

            handleFileSelect: function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    document.getElementById('bulk_csv_input').value = text;
                    this.previewBulkImport();
                };
                reader.readAsText(file);
            },

            parseBulkRows: function() {
                const raw = document.getElementById('bulk_csv_input')?.value.trim() || '';
                if (!raw) return [];

                const lines = raw.split('\n');
                const parsed = [];

                lines.forEach(line => {
                    if (!line.trim() || line.startsWith('Prefijo,')) return;

                    // Manejo básico de valores separados por comas o tabulaciones de Excel
                    const separator = line.includes('\t') ? '\t' : ',';
                    const parts = line.split(separator).map(p => p.trim().replace(/^"(.*)"$/, '$1'));

                    if (parts.length >= 4) {
                        const prefix = parts[0] || 'TLB';
                        const consecutivo = (parts[1] || '001').padStart(3, '0');
                        const anio = parts[2] || new Date().getFullYear();
                        const num = `${prefix}/${consecutivo}/${anio}`;

                        const nom = parts[3] || '';
                        const pat = parts[4] || '';
                        const mat = parts[5] || '';
                        const actor = `${nom} ${pat} ${mat}`.trim() || parts[3];

                        const demandado = parts[6] || parts[4] || 'Por Designar';
                        const juicio = parts[7] || parts[5] || 'Ordinario Burocrático';
                        const area = parts[8] || 'Secretaría de Acuerdos de Inicio';
                        const tarea = parts[9] || 'Registro Inicial Masivo';

                        parsed.push({
                            prefix,
                            consecutivo,
                            anio,
                            numero: num,
                            actorNombre: nom,
                            actorPaterno: pat,
                            actorMaterno: mat,
                            actor,
                            demandado,
                            juicio,
                            encargado: area,
                            tarea
                        });
                    }
                });
                return parsed;
            },

            previewBulkImport: function() {
                const parsed = this.parseBulkRows();
                const container = document.getElementById('bulk_preview_container');
                const tbody = document.getElementById('bulk_preview_tbody');
                const badge = document.getElementById('bulk_count_badge');

                if (!container || !tbody) return;

                if (parsed.length === 0) {
                    container.classList.add('hidden');
                    return;
                }

                container.classList.remove('hidden');
                badge.innerText = `Vista Previa (${parsed.length} expedientes listos para procesar):`;

                tbody.innerHTML = parsed.map(e => `
                    <tr class="hover:bg-slate-100">
                        <td class="p-1.5 font-mono font-bold text-slate-900">${e.numero}</td>
                        <td class="p-1.5 font-medium">${e.actor}</td>
                        <td class="p-1.5 text-slate-600">${e.demandado}</td>
                        <td class="p-1.5 text-slate-700">${e.juicio}</td>
                        <td class="p-1.5 font-semibold text-slate-800">${e.encargado}</td>
                    </tr>
                `).join('');
            },

            processBulkImport: function() {
                const parsed = this.parseBulkRows();
                if (parsed.length === 0) {
                    showAlert('Ingrese o cargue al menos una fila con datos válidos.', 'warning');
                    return;
                }

                let count = 0;
                const nowStr = new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX');

                parsed.forEach(item => {
                    if (!this.expedientes.some(e => e.numero === item.numero)) {
                        const newExp = {
                            id: 'exp-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                            ...item,
                            fechaRegistro: nowStr,
                            historial: [{
                                fecha: nowStr,
                                usuario: this.currentUser ? this.currentUser.name : 'Admin',
                                area: item.encargado,
                                accion: 'Alta por Carga Masiva de Excel'
                            }]
                        };

                        this.expedientes.unshift(newExp);

                        if (window.firebaseDb && window.firestoreCollections) {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc }) => {
                                const docRef = window.firestoreCollections.publicDoc('expedientes', newExp.id);
                                setDoc(docRef, newExp).catch(err => console.warn("Firestore save fallback:", err));
                            });
                        }
                        count++;
                    }
                });

                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                this.logAudit('Carga Masiva', `Importación exitosa de ${count} expedientes.`);
                showAlert(`Carga Masiva Exitosa: Se registraron ${count} nuevos expedientes.`, 'success');
                closeModal();
                this.renderDashboard();
            },

            exportToCSV: function() {
                let csv = "Numero,Actor,Demandado,Juicio,Encargado,Tarea\n";
                this.expedientes.forEach(e => {
                    csv += `"${e.numero}","${e.actor}","${e.demandado}","${e.juicio}","${e.encargado}","${e.tarea}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `expedientes_ponencia3_${Date.now()}.csv`;
                a.click();
            },

                                <button type="submit" class="px-4 py-2 bg-slate-800 text-white font-bold rounded">Enviar Solicitud</button>
                            </div>
                        </form>
                    </div>
                `;
                openModal(content);
            },

            handleRegisterSubmit: function(e) {
                e.preventDefault();
                const newUser = {
                    id: 'usr-' + Date.now().toString(36),
                    name: document.getElementById('reg_name').value.trim(),
                    username: document.getElementById('reg_user').value.trim(),
                    passwordHash: document.getElementById('reg_pass').value.trim(),
                    role: document.getElementById('reg_role').value,
                    status: 'pendiente'
                };
                this.users.push(newUser);
                localStorage.setItem('tb_users', JSON.stringify(this.users));
                showAlert('Solicitud enviada. Pendiente de aprobación por Admin.', 'info');
                closeModal();
            }
        };

        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>

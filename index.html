        // GARANTIZAR QUE SIEMPRE EXISTAN Y ESTÉN ACTIVOS LOS USUARIOS BASE (JUEZ, ADMIN, ACUERDOS, ACTUARIO)
        function ensureDefaultUsers() {
            if (!Array.isArray(users) || users.length === 0) {
                users = JSON.parse(JSON.stringify(DEFAULT_USERS));
            } else {
                DEFAULT_USERS.forEach(defaultUser => {
                    const idx = users.findIndex(u => u && u.username && u.username.toLowerCase() === defaultUser.username.toLowerCase());
                    if (idx === -1) {
                        users.push(JSON.parse(JSON.stringify(defaultUser)));
                    } else {
                        // Forzar que los usuarios clave siempre estén en estado Activo
                        users[idx].status = 'Activo';
                        users[idx].password = defaultUser.password;
                    }
                });
            }
            saveState();
        }
        ensureDefaultUsers();

        function saveState() {
            localStorage.setItem('tld_users', JSON.stringify(users));
            localStorage.setItem('tld_expedientes', JSON.stringify(expedientes));
            localStorage.setItem('tld_audit_logs', JSON.stringify(auditLogs));
            localStorage.setItem('tld_current_user', JSON.stringify(currentUser));

        // UNEDITABLE AUDIT LOGGER
        function logAction(actionDescription) {
            const newLog = {
                id: 'log-' + Date.now(),
                fecha: new Date().toLocaleString('es-MX'),
                usuario: currentUser ? `${currentUser.name} (${currentUser.username})` : 'Sistema / Anónimo',

                area: currentUser ? currentUser.area : 'N/A'

            saveState();

            // Sincronización en la nube si Firebase está activo

                try {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {

            }

        // CÁLCULO DE DÍAS HÁBILES TRANSCURRIDOS (EXCLUYE SÁBADOS Y DOMINGOS)
        function calcularDiasHabilesTranscurridos(fechaTurnoStr) {
            if (!fechaTurnoStr) return { dias: 0, estado: 'verde', label: '0 días hábiles' };

            let fechaInicio;
            try {
                // Parse format "YYYY-MM-DD HH:MM" or "DD/MM/YYYY HH:MM"
                const parts = fechaTurnoStr.split(' ');
                const dateParts = parts[0].includes('/') ? parts[0].split('/') : parts[0].split('-');
                if (dateParts[0].length === 4) {
                    fechaInicio = new Date(`${dateParts[0]}-${dateParts[1]}-${dateParts[2]}T${parts[1] || '08:00'}`);
                } else {
                    fechaInicio = new Date(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1] || '08:00'}`);
                }
            } catch (err) {
                fechaInicio = new Date();
            }

            if (isNaN(fechaInicio.getTime())) fechaInicio = new Date();

            const hoy = new Date();
            let diasHabiles = 0;
            let tempDate = new Date(fechaInicio);

            // Set times to midnight for clean day comparisons
            tempDate.setHours(0, 0, 0, 0);
            const hoyMidnight = new Date(hoy);
            hoyMidnight.setHours(0, 0, 0, 0);

            while (tempDate < hoyMidnight) {
                tempDate.setDate(tempDate.getDate() + 1);
                const dayOfWeek = tempDate.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // 0 = Domingo, 6 = Sábado
                    diasHabiles++;
                }
            }

            let estado = 'verde';
            let bgClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
            let icon = 'check-circle';

            if (diasHabiles === 2) {
                estado = 'amarillo';
                bgClass = 'bg-amber-100 text-amber-900 border-amber-300 animate-pulse';
                icon = 'alert-triangle';
            } else if (diasHabiles >= 3) {
                estado = 'rojo';
                bgClass = 'bg-rose-100 text-rose-900 border-rose-400 font-bold animate-bounce';
                icon = 'alert-octagon';
            }

            return {
                dias: diasHabiles,
                estado: estado,
                bgClass: bgClass,
                icon: icon,
                label: `${diasHabiles} día${diasHabiles === 1 ? '' : 's'} hábil${diasHabiles === 1 ? '' : 'es'}`
            };
        }

        // MAIN APPLICATION LOGIC
        const app = {

            handleLogin: async function(e) {
                if (e && e.preventDefault) e.preventDefault();
                try {
                    const uInput = (document.getElementById('login-username').value || '').trim();
                    const pInput = (document.getElementById('login-password').value || '').trim();

                    if (!uInput || !pInput) {
                        showAlert('Por favor ingrese usuario y contraseña.', 'error');
                        return;
                    }

                    // 1. Obtener lista actualizada de usuarios directamente desde Firebase Firestore si está disponible
                    if (window.isFirebaseConfigured && window.db) {
                        try {
                            const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                            const querySnapshot = await getDocs(collection(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users'));
                            const cloudUsers = [];
                            querySnapshot.forEach(doc => cloudUsers.push(doc.data()));
                            if (cloudUsers.length > 0) {
                                users = cloudUsers;
                                localStorage.setItem('tld_users', JSON.stringify(users));
                            }
                        } catch (fbErr) {
                            console.warn("No se pudo obtener usuarios en tiempo real de Firebase, usando copia local:", fbErr);
                        }
                    }

                    // Asegurar usuarios default de respaldo si la base de datos está totalmente vacía
                    ensureDefaultUsers();

                    // 2. Validar coincidencia de credenciales
                    const user = users.find(x => 
                        x && x.username && x.password &&
                        x.username.toString().trim().toLowerCase() === uInput.toLowerCase() && 
                        x.password.toString().trim() === pInput
                    );

                    if (!user) {
                        showAlert('Usuario o contraseña incorrectos.', 'error');
                        return;
                    }

                    if (user.status === 'Pendiente') {
                        showAlert('Tu usuario aún no ha sido autorizado por el Juez o Administrador. Por favor comunícate con la Ponencia.', 'error');
                        return;
                    }

                    currentUser = user;
                    saveState();
                    logAction(`Inicio de sesión exitoso en la plataforma.`);
                    showAlert(`Bienvenido/a, ${user.name}`, 'success');
                    this.renderDashboard();
                } catch (err) {
                    console.error("Error durante el inicio de sesión:", err);
                    ensureDefaultUsers();
                    showAlert('Error al procesar el inicio de sesión. Intente nuevamente.', 'error');
                }
            },

                        x && x.username && x.password &&
                        x.username.toString().trim().toLowerCase() === uInput.toLowerCase() && 
                        x.password.toString().trim() === pInput

                        showAlert('Tu usuario aún no ha sido autorizado por el Juez o Administrador. Por favor comunícate con la Ponencia.', 'error');
                        return;
                    }

                    currentUser = user;
                    saveState();
                    logAction(`Inicio de sesión exitoso en la plataforma.`);
                    showAlert(`Bienvenido/a, ${user.name}`, 'success');
                    this.renderDashboard();
                } catch (err) {
                    console.error("Error durante el inicio de sesión:", err);
                    // Reset de emergencia para restaurar cuentas maestro en caso de corrupción
                    localStorage.removeItem('tld_users');
                    users = JSON.parse(JSON.stringify(DEFAULT_USERS));
                    saveState();
                    showAlert('Se han restablecido las credenciales de acceso predeterminadas. Intente ingresar nuevamente.', 'info');
                }
            },

            handleRegisterSubmit: async function(e) {
                if (e && e.preventDefault) e.preventDefault();
                const username = (document.getElementById('reg-username').value || '').trim();

                // Traer datos frescos de Firebase antes de validar duplicados
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        const querySnapshot = await getDocs(collection(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users'));
                        const cloudUsers = [];
                        querySnapshot.forEach(doc => cloudUsers.push(doc.data()));
                        if (cloudUsers.length > 0) users = cloudUsers;
                    } catch(err) { console.error(err); }
                }

                if (users.some(u => u && u.username && u.username.toLowerCase() === username.toLowerCase() && (u.status === 'Activo' || u.status === 'Pendiente'))) {
                    showAlert('El nombre de usuario ya se encuentra registrado o tiene una solicitud activa pendiente.', 'error');
                    return;
                }

                const nombInput = document.getElementById('reg-doc-nombramiento');
                const ineInput = document.getElementById('reg-doc-ine');

                const docNombramiento = (nombInput && nombInput.files && nombInput.files[0]) ? nombInput.files[0].name : 'Nombramiento_Adjunto.pdf';
                const docINE = (ineInput && ineInput.files && ineInput.files[0]) ? ineInput.files[0].name : 'INE_Adjunto.pdf';

                const newUser = {
                    id: 'u-' + Date.now(),
                    name: document.getElementById('reg-name').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    username: username,
                    password: document.getElementById('reg-password').value.trim(),
                    area: document.getElementById('reg-area').value,
                    role: document.getElementById('reg-role').value,
                    status: 'Pendiente',
                    fechaAlta: new Date().toISOString().split('T')[0],
                    docNombramiento: docNombramiento,
                    docINE: docINE,
                    acuerdoAceptado: true
                };

                users.push(newUser);
                saveState();

                // Sincronizar usuario inmediatamente con Firebase Firestore
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', newUser.id), newUser);
                    } catch(err) { 
                        console.error("Error guardando en Firebase:", err); 
                    }
                }

                logAction(`Nueva solicitud de registro enviada por el usuario ${newUser.username} (${newUser.name}).`);
                closeModal();
                showAlert('Solicitud registrada correctamente en Firebase. El Juez o Administrador revisará tu expediente y documentos.', 'success');
                if (currentUser) this.renderAdminPanel();
            },

            cambiarAreaUsuario: function(userId, nuevaArea) {
                const u = users.find(x => x.id === userId);
                if (!u) return;

                const areaAnterior = u.area;
                u.area = nuevaArea;
                saveState();

                // Actualización en tiempo real en Firebase
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                            setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', u.id), u);
                        });
                    } catch(err) { console.error("Error cambiando área en Firebase:", err); }
                }

                logAction(`Reasignación de área para el usuario ${u.username}: de [${areaAnterior}] a [${nuevaArea}].`);
                showAlert(`El área de ${u.name} se actualizó correctamente a: ${nuevaArea}`, 'success');
                this.renderAdminPanel();
            },

            approveUser: function(id) {
                const u = users.find(x => x.id === id);
                if (u) {
                    u.status = 'Activo';
                    saveState();

                    // Sincronización Inmediata y Forzada en la Nube
                    if (window.isFirebaseConfigured && window.db) {
                        try {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', u.id), u);
                            });
                        } catch(err) { console.error("Error al sincronizar estado de usuario:", err); }
                    }

                    logAction(`Alta de usuario aprobada para ${u.name} (${u.username}).`);
                    showAlert(`Usuario ${u.name} autorizado activamente. Ya puede iniciar sesión.`, 'success');
                    this.renderAdminPanel();
                }
            },

            rejectUser: function(id) {
                const u = users.find(x => x.id === id);
                users = users.filter(x => x.id !== id);
                saveState();

                // Eliminar definitivamente de Firebase Firestore para evitar reaparición al refrescar
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, deleteDoc }) => {
                            deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', id));
                        });
                    } catch(err) { console.error("Error eliminando usuario rechazado de Firebase:", err); }
                }

                if (u) logAction(`Solicitud de alta rechazada y descartada permanentemente para ${u.username}.`);
                showAlert('Solicitud de usuario rechazada y descartada correctamente.');
                this.renderAdminPanel();
            },

                        (e.actor && e.actor.toLowerCase().includes(searchInput)) ||
                        (e.demandado && e.demandado.toLowerCase().includes(searchInput)) ||
                        (e.juicio && e.juicio.toLowerCase().includes(searchInput)) ||
                        (e.areaActual && e.areaActual.toLowerCase().includes(searchInput))
                    );
                }

                tbody.innerHTML = this.renderExpedientesRows(filtered);
                lucide.createIcons();
            },

            handleSaveNuevoExpediente: function(e) {
                e.preventDefault();
                const now = new Date().toLocaleString('es-MX');

                const newExp = {
                    id: 'exp-' + Date.now(),
                    numero: document.getElementById('exp-numero').value.trim(),
                    juicio: document.getElementById('exp-juicio').value.trim(),
                    actor: document.getElementById('exp-actor').value.trim(),
                    demandado: document.getElementById('exp-demandado').value.trim(),
                    areaActual: currentUser.area,
                    estadoRecepcion: 'Aceptado',
                    fechaTurno: now,
                    tareaPendiente: document.getElementById('exp-tarea').value.trim(),
                    historial: [
                        {
                            fecha: now,
                            usuario: currentUser.name,
                            area: currentUser.area,
                            accion: `Alta de expediente e ingreso de promoción inicial: ${document.getElementById('exp-tarea').value.trim()}`
                        }
                    ]
                };

                expedientes.unshift(newExp);
                saveState();

                // Guardar en la nube Firebase
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                            setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', newExp.id), newExp);
                        });
                    } catch(err) { console.error(err); }
                }

                logAction(`Creación de expediente N° ${newExp.numero} (${newExp.juicio}).`);
                closeModal();
                showAlert('Expediente registrado en la base de datos global.', 'success');
                this.renderDashboard();
            },

            // --- ACEPTAR RECEPCIÓN DE EXPEDIENTE ---
            aceptarRecepcionExpediente: function(id) {
                const exp = expedientes.find(e => e.id === id);
                if (exp) {
                    const now = new Date().toLocaleString('es-MX');
                    exp.estadoRecepcion = 'Aceptado';
                    exp.historial.unshift({
                        fecha: now,
                        usuario: currentUser.name,
                        area: currentUser.area,
                        accion: `Recepción y aceptación física del expediente en el área de ${currentUser.area}.`
                    });
                    saveState();

                    // Actualizar en Firebase
                    if (window.isFirebaseConfigured && window.db) {
                        try {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                            });
                        } catch(err) { console.error(err); }
                    }

                    logAction(`Aceptación de recepción física de expediente N° ${exp.numero} en área ${currentUser.area}.`);
                    showAlert(`Expediente ${exp.numero} recibido correctamente en ${currentUser.area}.`, 'success');
                    this.renderDashboard();
                }
            },

            // --- TURNAR EXPEDIENTE ---
            handleSaveTurno: function(e, id) {
                if (e && e.preventDefault) e.preventDefault();
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const areaSelect = document.getElementById('turno-area');
                const tareaInput = document.getElementById('turno-tarea');

                if (!areaSelect || !areaSelect.value) {
                    showAlert('Por favor seleccione el área de destino del turno.', 'error');
                    return;
                }

                const areaDestino = areaSelect.value;
                const tarea = (tareaInput ? tareaInput.value : '').trim();
                const now = new Date().toLocaleString('es-MX');

                exp.areaActual = areaDestino;
                exp.ultimoTurnoDestino = areaDestino;
                exp.estadoRecepcion = 'Pendiente_Aceptacion';
                exp.fechaTurno = now;
                exp.tareaPendiente = tarea || 'Turno enviado para su atención y trámite.';

                if (!Array.isArray(exp.historial)) exp.historial = [];
                exp.historial.unshift({
                    fecha: now,
                    usuario: currentUser ? currentUser.name : 'Usuario',
                    area: currentUser ? currentUser.area : 'N/A',
                    accion: `Turnado formalmente a [${areaDestino}]. Indicación: ${exp.tareaPendiente}`
                });

                saveState();

                // Actualizar en Firebase para sincronización instantánea
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                            setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                        });
                    } catch(err) { console.error("Error guardando turno en Firebase:", err); }
                }

                logAction(`Turno de expediente N° ${exp.numero} hacia ${areaDestino}.`);
                closeModal();
                showAlert(`Expediente turnado exitosamente a ${areaDestino}.`, 'success');
                this.renderDashboard();
            },

            renderTurnarExpedienteModal: function(id) {
                const exp = expedientes.find(x => x.id === id);
                if (!exp) {
                    showAlert('Error: No se encontró el expediente a turnar.', 'error');
                    return;
                }

                const availableAreas = AREAS.filter(a => a !== exp.areaActual);

                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <div>
                            <h3 class="font-bold text-sm font-serif">Turnar Expediente N° ${exp.numero}</h3>
                            <p class="text-xs text-amber-300">Ubicación actual: ${exp.areaActual}</p>
                        </div>
                        <button type="button" onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form onsubmit="app.handleSaveTurno(event, '${exp.id}')" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Área Destino del Turno</label>
                            <select id="turno-area" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 font-semibold text-slate-800">
                                <option value="" disabled selected>-- Seleccione el área de destino --</option>
                                ${availableAreas.map(a => `<option value="${a}">${a}</option>`).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Instrucciones / Indicación del Turno</label>
                            <textarea id="turno-tarea" required rows="3" placeholder="Ej. Para elaboración de acuerdo de inicio / notificación personal / proyecto de resolución..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500"></textarea>
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm font-bold">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-sm shadow flex items-center space-x-1.5">
                                <i data-lucide="send" class="w-4 h-4"></i>
                                <span>Confirmar y Turnar Expediente</span>
                            </button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            renderDeleteExpedienteModal: function(id) {
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const html = `
                    <div class="bg-rose-900 p-4 text-white flex justify-between items-center">
                        <h3 class="font-bold text-sm">Confirmar Eliminación de Expediente</h3>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form onsubmit="app.confirmDeleteExpediente(event, '${exp.id}')" class="p-6 space-y-4">
                        <p class="text-xs text-slate-700">¿Está seguro de eliminar de forma permanente el expediente <strong class="font-mono">${exp.numero}</strong>?</p>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Ingrese su Contraseña de Administrador</label>
                            <input type="password" id="delete-admin-password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-rose-500">
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white font-bold rounded-lg text-sm shadow">Eliminar Expediente</button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            // --- VER HISTORIAL Y TRAZABILIDAD (UNEDITABLE) ---
            verDetalleExpediente: function(id) {
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <div>
                            <h3 class="font-bold text-base font-serif">${exp.numero}</h3>
                            <p class="text-xs text-amber-300 font-sans">${exp.juicio}</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
                            <div><span class="font-bold text-slate-700">Actor:</span> ${exp.actor}</div>
                            <div><span class="font-bold text-slate-700">Demandado:</span> ${exp.demandado}</div>
                            <div><span class="font-bold text-slate-700">Ubicación Actual:</span> <span class="text-amber-700 font-bold">${exp.areaActual}</span></div>
                            <div><span class="font-bold text-slate-700">Estatus:</span> ${exp.estadoRecepcion}</div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center border-b pb-1 mb-3">
                                <h4 class="font-bold text-xs uppercase tracking-wider text-slate-700">Trazabilidad Inalterable del Expediente</h4>
                                <span class="text-[10px] text-slate-500 font-semibold flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3 text-amber-600"></i> Historial protegido</span>
                            </div>
                            <div class="space-y-3 relative pl-4 border-l-2 border-slate-300">
                                ${exp.historial.map(h => `
                                    <div class="relative group">
                                        <div class="w-2.5 h-2.5 bg-amber-500 rounded-full absolute -left-[21px] top-1 border border-white"></div>
                                        <div class="text-[11px] text-slate-500 font-semibold">${h.fecha} • <span class="text-slate-800 font-bold">${h.usuario}</span> (${h.area})</div>
                                        <div class="text-xs text-slate-700 mt-0.5 bg-slate-100 p-2 rounded border border-slate-200">${h.accion}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-slate-100 text-right border-t">
                        <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-800 text-white rounded text-xs font-bold">Cerrar</button>
                    </div>
                `;
                openModal(html);
            }
        };

        // GLOBAL MODAL HELPERS
        function openModal(htmlContent) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (container && content) {
                content.innerHTML = htmlContent;
                container.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) {
                container.classList.add('hidden');
            }
        }

        function showAlert(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            if (!toastContainer) return;

            const toast = document.createElement('div');
            toast.className = `p-3 rounded-lg shadow-lg text-xs font-bold text-white flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${type === 'error' ? 'bg-rose-700' : type === 'success' ? 'bg-emerald-700' : 'bg-slate-800'}`;
            toast.innerHTML = `<span>${message}</span>`;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // RUN APPLICATION ON LOAD
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Expedientes - Ponencia Tres</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #1e293b;
        }

        .font-serif {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* Metallic & Silver Theme Accents */
        .silver-gradient {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
        }

        .silver-header-gradient {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 2px solid #64748b;
        }

        .silver-card-border {
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .silver-badge {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-800 antialiased selection:bg-slate-700 selection:text-white">

    <!-- App Main Container -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Dynamic Content Rendered Here -->
    </div>

    <!-- Global Modal Container -->
    <div id="modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl border border-slate-300 max-w-4xl w-full max-h-[92vh] overflow-y-auto transform transition-all">
            <!-- Modal Body injected via JS -->
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-md w-full px-4 pointer-events-none"></div>

    <script>
        // Global Modal Controls
        function openModal(content) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = content;
            modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
        }

        // Global Alert Toast Function
        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const bgColors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                danger: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-950 border-amber-400 font-semibold',
                info: 'bg-slate-800 text-slate-100 border-slate-600'
            };

            const icons = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                warning: 'alert-circle',
                info: 'info'
            };

            const toast = document.createElement('div');
            toast.className = `p-3 rounded-lg shadow-xl border ${bgColors[type] || bgColors.info} text-xs flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
                    <span>${msg}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-xs opacity-70 hover:opacity-100 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            `;

            container.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => toast.remove(), 300);
                }
            }, 5000);
        }

        // Default Users Initialization
        const DEFAULT_USERS = [
            { id: 'usr-1', username: 'Admin', name: 'Administrador General', role: 'Admin', passwordHash: '662666', status: 'aprobado' },
            { id: 'usr-2', username: 'Juez3', name: 'Juez de la Ponencia 3', role: 'Juez', passwordHash: '123', status: 'aprobado' },
            { id: 'usr-3', username: 'Secretario1', name: 'Lic. Roberto Gómez', role: 'Secretaría de Acuerdos', passwordHash: '123', status: 'aprobado' },
            { id: 'usr-4', username: 'Proyectista1', name: 'Lic. María Elena Torres', role: 'Mesa de Dictamen', passwordHash: '123', status: 'aprobado' },
            { id: 'usr-5', username: 'Notificador1', name: 'Lic. Carlos Mendoza', role: 'Actuaría / Notificaciones', passwordHash: '123', status: 'aprobado' }
        ];

        // Seed Default Expedientes
        const DEFAULT_EXPEDIENTES = [
            {
                id: 'exp-1',
                prefix: 'TLB',
                consecutivo: '101',
                anio: '2025',
                numero: 'TLB/101/2025',
                actorNombre: 'Juan Manuel',
                actorPaterno: 'Hernández',
                actorMaterno: 'Pérez',
                actor: 'Juan Manuel Hernández Pérez',
                demandado: 'Secretaría de Educación del Estado de Durango',
                juicio: 'Ordinario Burocrático',
                tarea: 'Recibido en Turno',
                encargado: 'Secretaria de Acuerdos',
                fechaRegistro: '15/01/2025 10:30',
                expedienteVinculado: '',
                amparo: {
                    tipo: 'Indirecto',
                    juzgado: 'Juzgado Primero de Distrito en Durango',
                    numeroAmparo: '520/2025',
                    fechaTerminoFatal: '2026-11-05',
                    observaciones: 'Pendiente informe justificado.'
                },
                historial: [
                    { fecha: '15/01/2025 10:30', usuario: 'Admin', area: 'Mesa de Entrada', accion: 'Registro inicial del expediente con asignación de prefijo TLB.' }
                ]
            },
            {
                id: 'exp-2',
                prefix: 'PE',
                consecutivo: '042',
                anio: '2025',
                numero: 'PE/042/2025',
                actorNombre: 'Rosa María',
                actorPaterno: 'Valenzuela',
                actorMaterno: 'Soto',
                actor: 'Rosa María Valenzuela Soto',
                demandado: 'Ayuntamiento del Municipio de Durango',
                juicio: 'Procedimiento Especial',
                tarea: 'Proyecto de Resolución',
                encargado: 'Mesa de Dictamen',
                fechaRegistro: '20/01/2025 11:15',
                expedienteVinculado: '',
                amparo: null,
                historial: [
                    { fecha: '20/01/2025 11:15', usuario: 'Admin', area: 'Mesa de Entrada', accion: 'Registro inicial como Procedimiento Especial.' }
                ]
            },
            {
                id: 'exp-3',
                prefix: 'CONVENIO',
                consecutivo: '018',
                anio: '2025',
                numero: 'CONVENIO/018/2025',
                actorNombre: 'José Luis',
                actorPaterno: 'Ramírez',
                actorMaterno: 'Ortiz',
                actor: 'José Luis Ramírez Ortiz',
                demandado: 'Comisión del Agua del Estado de Durango',
                juicio: 'Convenio Conciliatorio',
                tarea: 'Notificación Pendiente',
                encargado: 'Actuaría / Notificaciones',
                fechaRegistro: '02/02/2025 09:45',
                expedienteVinculado: '',
                amparo: null,
                historial: [
                    { fecha: '02/02/2025 09:45', usuario: 'Admin', area: 'Mesa de Entrada', accion: 'Registro inicial de procedimiento de Convenio.' }
                ]
            }
        ];

        // Main Application Object
        const app = {
            currentUser: null,
            activeTab: 'dashboard',
            expedientes: [],
            users: [],
            auditLogs: [],
            reportesEntrega: [],
            emailConfig: {
                active: false,
                publicKey: '',
                serviceId: '',
                templateId: ''
            },

            init: function() {
                // Initialize Local Persistence
                const savedUsers = localStorage.getItem('tb_users');
                this.users = savedUsers ? JSON.parse(savedUsers) : DEFAULT_USERS;
                localStorage.setItem('tb_users', JSON.stringify(this.users));

                const savedExps = localStorage.getItem('tb_expedientes');
                this.expedientes = savedExps ? JSON.parse(savedExps) : DEFAULT_EXPEDIENTES;
                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));

                const savedLogs = localStorage.getItem('tb_audit_logs');
                this.auditLogs = savedLogs ? JSON.parse(savedLogs) : [];
                this.cleanOldAuditLogs();

                const savedReports = localStorage.getItem('tb_reportes_entrega');
                this.reportesEntrega = savedReports ? JSON.parse(savedReports) : [];

                const savedEmailConfig = localStorage.getItem('tb_email_config');
                if (savedEmailConfig) {
                    this.emailConfig = JSON.parse(savedEmailConfig);
                    if (this.emailConfig.active && this.emailConfig.publicKey) {
                        try {
                            emailjs.init(this.emailConfig.publicKey);
                        } catch(err) {
                            console.warn('EmailJS init issue:', err);
                        }
                    }
                }

                // Check Active Session
                const session = localStorage.getItem('tb_session');
                if (session) {
                    this.currentUser = JSON.parse(session);
                    this.renderDashboard();
                } else {
                    this.renderLogin();
                }
            },

            // 1-Year Audit Log Retention Policy
            cleanOldAuditLogs: function() {
                const oneYearAgo = Date.now() - (365 * 24 * 60 * 60 * 1000);
                this.auditLogs = this.auditLogs.filter(log => {
                    const logTime = new Date(log.timestamp || log.fecha).getTime();
                    return logTime >= oneYearAgo;
                });
                localStorage.setItem('tb_audit_logs', JSON.stringify(this.auditLogs));
            },

            logAudit: function(action, details) {
                const now = new Date();
                const logEntry = {
                    id: 'LOG-' + Date.now().toString(36),
                    fecha: now.toLocaleDateString('es-MX') + ' ' + now.toLocaleTimeString('es-MX'),
                    timestamp: now.getTime(),
                    usuario: this.currentUser ? this.currentUser.name : 'Sistema',
                    username: this.currentUser ? this.currentUser.username : 'system',
                    role: this.currentUser ? this.currentUser.role : 'Invitado',
                    accion: action,
                    detalles: details
                };
                this.auditLogs.unshift(logEntry);
                this.cleanOldAuditLogs();
            },

            setTab: function(tab) {
                this.activeTab = tab;
                this.renderDashboard();
            },

            // Login Screen View with Institutional Styling
            renderLogin: function() {
                const container = document.getElementById('app');
                container.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950 relative overflow-hidden">
                        <!-- Institutional Greyscale Watermark Shield -->
                        <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
                            <i data-lucide="scale" class="w-[600px] h-[600px] text-slate-100"></i>
                        </div>

                        <div class="max-w-md w-full bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 relative z-10 space-y-6">
                            <!-- Institutional Header -->
                            <div class="text-center space-y-2 border-b border-slate-800 pb-5">
                                <div class="inline-flex p-3 rounded-2xl bg-slate-800 border border-slate-600 shadow-inner">
                                    <i data-lucide="landmark" class="w-10 h-10 text-slate-200"></i>
                                </div>
                                <h1 class="text-xl sm:text-2xl font-serif font-bold text-slate-100 tracking-tight">
                                    Tribunal Laboral Burocrático
                                </h1>
                                <p class="text-xs uppercase tracking-widest font-semibold text-slate-400">
                                    Estado de Durango | Ponencia Tres
                                </p>
                            </div>

                            <!-- Login Form -->
                            <form onsubmit="app.handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Servidor Público / Usuario</label>
                                    <div class="relative">
                                        <i data-lucide="user" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input type="text" id="login_user" class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-slate-400" placeholder="Ej. Admin o Juez3" required>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Contraseña de Acceso</label>
                                    <div class="relative">
                                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input type="password" id="login_pass" class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-slate-400" placeholder="••••••••" required>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between text-xs text-slate-400">
                                    <button type="button" onclick="app.renderForgotPasswordModal()" class="hover:text-slate-200 underline">
                                        ¿Olvidaste tu contraseña?
                                    </button>
                                </div>

                                <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-slate-700 via-slate-600 to-slate-700 hover:from-slate-600 hover:to-slate-500 text-white font-semibold text-xs rounded-lg shadow-lg border border-slate-500 transition-all flex items-center justify-center gap-2">
                                    <i data-lucide="key-round" class="w-4 h-4"></i> Iniciar Sesión en Sistema
                                </button>
                            </form>

                            <div class="pt-4 border-t border-slate-800 text-center space-y-2">
                                <button type="button" onclick="app.renderRegisterModal()" class="text-xs text-slate-400 hover:text-slate-200">
                                    ¿Nuevo Servidor Público? <span class="font-bold underline text-slate-300">Solicitar Registro de Usuario</span>
                                </button>
                                <p class="text-[10px] text-slate-500">Credenciales por defecto: <strong>Admin</strong> (662666) | <strong>Juez3</strong> (123)</p>
                            </div>
                        </div>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
            },

            handleLoginSubmit: function(e) {
                e.preventDefault();
                const uInput = document.getElementById('login_user').value.trim();
                const pInput = document.getElementById('login_pass').value.trim();

                const user = this.users.find(u => u.username.toLowerCase() === uInput.toLowerCase());

                if (!user) {
                    showAlert('El nombre de usuario especificado no existe.', 'danger');
                    return;
                }

                if (user.status === 'pendiente') {
                    showAlert('Su cuenta aún está pendiente de aprobación por el Administrador General.', 'warning');
                    return;
                }

                if (user.status === 'rechazado') {
                    showAlert('Su solicitud de acceso ha sido rechazada por la administración.', 'danger');
                    return;
                }

                if (user.passwordHash !== pInput) {
                    showAlert('Contraseña de acceso incorrecta.', 'danger');
                    return;
                }

                this.currentUser = user;
                localStorage.setItem('tb_session', JSON.stringify(user));
                this.logAudit('Inicio de Sesión', `Acceso exitoso al sistema.`);
                showAlert(`Bienvenido/a, ${user.name}`, 'success');
                this.renderDashboard();
            },

            logout: function() {
                if (this.currentUser) {
                    this.logAudit('Cierre de Sesión', 'Cierre voluntario de sesión.');
                }
                this.currentUser = null;
                localStorage.removeItem('tb_session');
                this.renderLogin();
            },

            // Dynamic Case Number Prefix Selector (TLB / PE / CONVENIO)
            renderCasePrefixSelector: function(selectedPrefix = 'TLB', selectedNum = '', selectedYear = new Date().getFullYear()) {
                const years = [];
                const currentYr = new Date().getFullYear();
                for (let y = currentYr; y >= 2020; y--) years.push(y);

                return `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Procedimiento</label>
                            <select id="exp_prefix" class="w-full text-xs p-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-slate-500 font-semibold bg-slate-50">
                                <option value="TLB" ${selectedPrefix === 'TLB' ? 'selected' : ''}>TLB (Ordinario Burocrático)</option>
                                <option value="PE" ${selectedPrefix === 'PE' ? 'selected' : ''}>PE (Procedimiento Especial)</option>
                                <option value="CONVENIO" ${selectedPrefix === 'CONVENIO' ? 'selected' : ''}>CONVENIO (Procedimiento Convenio)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Consecutivo</label>
                            <input type="number" id="exp_consecutivo" value="${selectedNum}" min="1" max="9999" placeholder="Ej. 104" class="w-full text-xs p-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-slate-500 font-mono" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Año</label>
                            <select id="exp_anio" class="w-full text-xs p-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-slate-500 font-mono bg-slate-50">
                                ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
            },

            // Structured Name Parsing for Parte Actora with Live Matching
            renderParteActoraInputs: function(defaultNombre = '', defaultPaterno = '', defaultMaterno = '') {
                return `
                    <div class="space-y-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
                        <label class="block text-xs font-bold text-slate-800 uppercase tracking-wider">Parte Actora (Sujeto Procesal)</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <div>
                                <label class="block text-[11px] text-slate-600 mb-0.5">Nombre(s)</label>
                                <input type="text" id="actor_nombre" value="${defaultNombre}" oninput="app.updateActorNameAndSearch()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-slate-500" placeholder="Ej. Juan Manuel" required>
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-600 mb-0.5">Apellido Paterno</label>
                                <input type="text" id="actor_paterno" value="${defaultPaterno}" oninput="app.updateActorNameAndSearch()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-slate-500" placeholder="Ej. Hernández">
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-600 mb-0.5">Apellido Materno</label>
                                <input type="text" id="actor_materno" value="${defaultMaterno}" oninput="app.updateActorNameAndSearch()" class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-slate-500" placeholder="Ej. Pérez">
                            </div>
                        </div>

                        <!-- Live Search Panel for Matching Antecedents -->
                        <div id="live_antecedents_panel" class="hidden pt-2 border-t border-slate-200">
                            <p class="text-[11px] font-bold text-amber-800 flex items-center gap-1 mb-1">
                                <i data-lucide="search" class="w-3.5 h-3.5"></i> Posibles Antecedentes / Coincidencias en Base de Datos:
                            </p>
                            <div id="live_antecedents_list" class="max-h-28 overflow-y-auto divide-y divide-slate-200 text-[11px] bg-white border rounded"></div>
                        </div>
                    </div>
                `;
            },

            updateActorNameAndSearch: function() {
                const nombre = document.getElementById('actor_nombre')?.value.trim() || '';
                const paterno = document.getElementById('actor_paterno')?.value.trim() || '';
                const materno = document.getElementById('actor_materno')?.value.trim() || '';

                const searchTerms = `${nombre} ${paterno} ${materno}`.trim().toLowerCase();
                const panel = document.getElementById('live_antecedents_panel');
                const list = document.getElementById('live_antecedents_list');

                if (searchTerms.length < 3) {
                    if (panel) panel.classList.add('hidden');
                    return;
                }

                const matches = this.expedientes.filter(e => {
                    const fullActor = (e.actor || `${e.actorNombre || ''} ${e.actorPaterno || ''} ${e.actorMaterno || ''}`).toLowerCase();
                    return fullActor.includes(searchTerms) || (paterno && fullActor.includes(paterno.toLowerCase()));
                });

                if (matches.length > 0) {
                    panel.classList.remove('hidden');
                    list.innerHTML = matches.map(m => `
                        <div class="p-1.5 flex items-center justify-between hover:bg-slate-50">
                            <div>
                                <span class="font-bold text-slate-900">${m.numero}</span> - 
                                <span class="text-slate-700">${m.actor}</span>
                                <span class="text-slate-500 text-[10px]">(${m.demandado})</span>
                            </div>
                            <button type="button" onclick="app.setLinkedExpediente('${m.numero}')" class="px-2 py-0.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded font-semibold text-[10px]">
                                Vincular A Este
                            </button>
                        </div>
                    `).join('');
                } else {
                    panel.classList.add('hidden');
                }
            },

            setLinkedExpediente: function(expNum) {
                const input = document.getElementById('exp_vinculado');
                const chkUnlink = document.getElementById('chk_desvincular');
                if (input) input.value = expNum;
                if (chkUnlink) chkUnlink.checked = false;
                showAlert(`Expediente antecedente ${expNum} seleccionado para vinculación.`, 'info');
            },

            // Main Dashboard Render
            renderDashboard: function() {
                const container = document.getElementById('app');
                const currentUser = this.currentUser;

                container.innerHTML = `
                    <!-- Header Bar -->
                    <header class="silver-header-gradient text-slate-100 shadow-xl sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-slate-800 border border-slate-600 rounded-xl shadow-inner">
                                    <i data-lucide="landmark" class="w-6 h-6 text-slate-300"></i>
                                </div>
                                <div>
                                    <h1 class="text-base sm:text-lg font-serif font-bold text-slate-100">
                                        Tribunal Laboral Burocrático | Ponencia Tres
                                    </h1>
                                    <p class="text-[11px] text-slate-400">Control Digital y Gestión de Expedientes</p>
                                </div>
                            </div>

            handleNewExpedienteSubmit: function(e) {
                e.preventDefault();
                const prefix = document.getElementById('exp_prefix').value;
                const consecutivo = document.getElementById('exp_consecutivo').value.padStart(3, '0');
                const anio = document.getElementById('exp_anio').value;
                const numero = `${prefix}/${consecutivo}/${anio}`;

                const nombre = document.getElementById('actor_nombre').value.trim();
                const paterno = document.getElementById('actor_paterno').value.trim();
                const materno = document.getElementById('actor_materno').value.trim();
                const fullActor = `${nombre} ${paterno} ${materno}`.trim();

                const demandado = document.getElementById('exp_demandado').value.trim();
                const juicio = document.getElementById('exp_juicio').value.trim();
                const tarea = document.getElementById('exp_tarea').value;
                const vinculado = document.getElementById('exp_vinculado').value.trim();

                const newExp = {
                    id: 'exp-' + Date.now().toString(36),
                    prefix, consecutivo, anio, numero,
                    actorNombre: nombre, actorPaterno: paterno, actorMaterno: materno,
                    actor: fullActor, demandado, juicio, tarea,
                    encargado: this.currentUser.role,
                    fechaRegistro: new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX'),
                    expedienteVinculado: vinculado,
                    amparo: null,
                    historial: [
                        {
                            fecha: new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX'),
                            usuario: this.currentUser.name,
                            area: this.currentUser.role,
                            accion: `Registro del expediente ${numero}.${vinculado ? ' Vinculado con ' + vinculado : ''}`
                        }
                    ]
                };

                this.expedientes.unshift(newExp);
                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                this.logAudit('Nuevo Expediente', `Registrado expediente ${numero}`);
                closeModal();
                showAlert(`Expediente ${numero} registrado exitosamente.`, 'success');
                this.renderDashboard();
            },

            handleSaveEditExpediente: function(e, expId) {
                e.preventDefault();
                const exp = this.expedientes.find(e => e.id === expId);
                if (!exp) return;

                const nombre = document.getElementById('actor_nombre').value.trim();
                const paterno = document.getElementById('actor_paterno').value.trim();
                const materno = document.getElementById('actor_materno').value.trim();
                const fullActor = `${nombre} ${paterno} ${materno}`.trim();

                const demandado = document.getElementById('edit_demandado').value.trim();
                const tarea = document.getElementById('edit_tarea').value.trim();
                const chkDesvincular = document.getElementById('chk_desvincular')?.checked;
                const nuevoVinculo = chkDesvincular ? '' : document.getElementById('exp_vinculado').value.trim();

                const amparoTipo = document.getElementById('amparo_tipo').value;
                const amparoNumero = document.getElementById('amparo_numero').value.trim();
                const amparoFecha = document.getElementById('amparo_fecha').value;

                // Detect unlinking action for detailed logging
                const wasVinculado = exp.expedienteVinculado;
                if (wasVinculado && !nuevoVinculo) {
                    this.logAudit('Desvinculación', `El usuario ${this.currentUser.name} desvinculó el expediente ${exp.numero} de ${wasVinculado}`);
                } else if (!wasVinculado && nuevoVinculo) {
                    this.logAudit('Vinculación', `El usuario ${this.currentUser.name} vinculó el expediente ${exp.numero} con ${nuevoVinculo}`);
                }

                exp.actorNombre = nombre;
                exp.actorPaterno = paterno;
                exp.actorMaterno = materno;
                exp.actor = fullActor;
                exp.demandado = demandado;
                exp.tarea = tarea;
                exp.expedienteVinculado = nuevoVinculo;

                if (amparoTipo) {
                    exp.amparo = {
                        tipo: amparoTipo,
                        numeroAmparo: amparoNumero,
                        fechaTerminoFatal: amparoFecha,
                        juzgado: 'Juzgado de Distrito Federal'
                    };
                } else {
                    exp.amparo = null;
                }

                exp.historial = exp.historial || [];
                exp.historial.push({
                    fecha: new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX'),
                    usuario: this.currentUser.name,
                    area: this.currentUser.role,
                    accion: `Edición de expediente. ${wasVinculado && !nuevoVinculo ? 'Se realizó desvinculación.' : ''}`
                });

                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                closeModal();
                showAlert(`Expediente ${exp.numero} actualizado correctamente.`, 'success');
                this.renderDashboard();
            },

                                            <th class="p-3">N° Amparo Federal</th>
                                            <th class="p-3">Término Fatal</th>

                                        ${amparos.length === 0 ? `
                                            <tr>
                                                <td colspan="6" class="p-8 text-center text-slate-400">

                                                </td>
                                            </tr>

                                            const f = a.amparo.fechaTerminoFatal;
                                            let badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                                            let badgeText = 'En Plazo';

                                            if (f) {
                                                if (f < today) {
                                                    badgeClass = 'bg-rose-600 text-white animate-pulse font-bold';
                                                    badgeText = '¡VENCIDO!';
                                                } else if (f === today) {
                                                    badgeClass = 'bg-amber-500 text-slate-950 font-bold';
                                                    badgeText = 'VENCE HOY';
                                                }
                                            }

                                            return `
                                                <tr class="hover:bg-slate-50">
                                                    <td class="p-3 font-mono font-bold text-slate-900">${a.numero}</td>
                                                    <td class="p-3 font-semibold">${a.amparo.tipo}</td>
                                                    <td class="p-3 text-slate-700">${a.amparo.numeroAmparo || 'S/N'}</td>
                                                    <td class="p-3 font-mono font-bold">${a.amparo.fechaTerminoFatal || 'Sin fecha'}</td>
                                                    <td class="p-3">
                                                        <span class="px-2 py-0.5 rounded text-[10px] border ${badgeClass}">
                                                            ${badgeText}
                                                        </span>
                                                    </td>
                                                    <td class="p-3 text-right">
                                                        <button onclick="app.renderEditExpedienteModal('${a.id}')" class="px-2.5 py-1 bg-slate-800 text-white rounded text-xs hover:bg-slate-700">
                                                            Editar
                                                        </button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            // Download Excel Report (.csv Data URI)
            downloadExcelReport: function() {
                const headers = ['Numero', 'Prefix', 'Consecutivo', 'Anio', 'Parte Actora', 'Demandado', 'Juicio', 'Tarea', 'Encargado', 'Amparo'];
                const rows = this.expedientes.map(e => [
                    `"${e.numero}"`,
                    `"${e.prefix || ''}"`,
                    `"${e.consecutivo || ''}"`,
                    `"${e.anio || ''}"`,
                    `"${e.actor.replace(/"/g, '""')}"`,
                    `"${e.demandado.replace(/"/g, '""')}"`,
                    `"${e.juicio.replace(/"/g, '""')}"`,
                    `"${e.tarea}"`,
                    `"${e.encargado}"`,
                    `"${e.amparo ? e.amparo.tipo + ' ' + (e.amparo.numeroAmparo || '') : 'NO'}"`
                ]);

                const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csvContent);
                
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Reporte_Expedientes_Ponencia3_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showAlert('Reporte en Excel generado y descargado exitosamente.', 'success');
            },

            handleSendRecoveryCode: async function() {
                const userInput = document.getElementById('recovery_user_input')?.value.trim();
                if (!userInput) return;

                const user = this.users.find(u => u.username.toLowerCase() === userInput.toLowerCase() || u.email?.toLowerCase() === userInput.toLowerCase());
                if (!user) {
                    showAlert('Usuario no encontrado.', 'danger');
                    return;
                }

                const tempCode = Math.floor(100000 + Math.random() * 900000).toString();
                user.tempCode = tempCode;
                user.tempCodeExpires = Date.now() + (15 * 60 * 1000); // 15 mins

                localStorage.setItem('tb_users', JSON.stringify(this.users));

                if (this.emailConfig.active && this.emailConfig.serviceId) {
                    try {
                        await emailjs.send(this.emailConfig.serviceId, this.emailConfig.templateId, {
                            to_name: user.name,
                            to_email: user.email || 'usuario@durango.gob.mx',
                            code: tempCode,
                            subject: 'Código de Recuperación - Ponencia 3'
                        });
                        showAlert('Código enviado a su correo electrónico.', 'success');
                    } catch(err) {
                        console.warn('Email delivery notice:', err);
                    }
                } else {
                    showAlert(`Modo Simulación: Su clave temporal es ${tempCode}`, 'info');
                }

                document.getElementById('recovery_step1').classList.add('hidden');
                document.getElementById('recovery_step2').classList.remove('hidden');
            },

            handleVerifyAndResetPassword: function() {
                const code = document.getElementById('recovery_code_input')?.value.trim();
                const newPass = document.getElementById('recovery_new_pass')?.value.trim();

                const user = this.users.find(u => u.tempCode === code && u.tempCodeExpires > Date.now());

                if (!user) {
                    showAlert('Código inválido o expirado (duración 15 minutos).', 'danger');
                    return;
                }

                if (!newPass) {
                    showAlert('Ingrese la nueva contraseña.', 'warning');
                    return;
                }

                user.passwordHash = newPass;
                delete user.tempCode;
                delete user.tempCodeExpires;

                localStorage.setItem('tb_users', JSON.stringify(this.users));
                showAlert('Contraseña actualizada exitosamente.', 'success');
                closeModal();
            },

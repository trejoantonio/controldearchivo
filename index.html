        function ensureDefaultUsers() {
            if (!Array.isArray(users) || users.length === 0) {
                users = JSON.parse(JSON.stringify(DEFAULT_USERS));
            } else {
                DEFAULT_USERS.forEach(defaultUser => {
                    const idx = users.findIndex(u => u && u.username && u.username.toLowerCase() === defaultUser.username.toLowerCase());
                    if (idx === -1) {
                        users.push(JSON.parse(JSON.stringify(defaultUser)));
                    } else {
                        users[idx].status = 'Activo';
                        users[idx].password = defaultUser.password;
                    }
                });
            }
            // Asignar permisos por defecto si no existen
            users.forEach(u => {
                if (!u.permissions) {
                    if (u.role === 'Juez' || u.role === 'Administrador') {
                        u.permissions = { canRegister: true, canTurnar: true, canRecibir: true, canDelete: true, canViewAudit: true };
                    } else if (u.role === 'Oficial') {
                        u.permissions = { canRegister: true, canTurnar: true, canRecibir: true, canDelete: false, canViewAudit: false };
                    } else {
                        u.permissions = { canRegister: false, canTurnar: true, canRecibir: true, canDelete: false, canViewAudit: false };
                    }
                }
            });
            saveState();
        }
        ensureDefaultUsers();

            localStorage.setItem('tld_users', JSON.stringify(users));

                usuario: currentUser ? `${currentUser.name} (${currentUser.username})` : 'Sistema / Anónimo',

                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {

        // CÁLCULO DE DÍAS HÁBILES TRANSCURRIDOS (EXCLUYE SÁBADOS Y DOMINGOS)
        function calcularDiasHabilesTranscurridos(fechaTurnoStr) {
            if (!fechaTurnoStr) return { dias: 0, estado: 'verde', label: '0 días hábiles' };

            let fechaInicio;
            try {
                // Parse format "YYYY-MM-DD HH:MM" or "DD/MM/YYYY HH:MM"
                const parts = fechaTurnoStr.split(' ');
                const dateParts = parts[0].includes('/') ? parts[0].split('/') : parts[0].split('-');
                if (dateParts[0].length === 4) {
                    fechaInicio = new Date(`${dateParts[0]}-${dateParts[1]}-${dateParts[2]}T${parts[1] || '08:00'}`);
                } else {
                    fechaInicio = new Date(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1] || '08:00'}`);
                }
            } catch (err) {
                fechaInicio = new Date();
            }

            if (isNaN(fechaInicio.getTime())) fechaInicio = new Date();

            const hoy = new Date();
            let diasHabiles = 0;
            let tempDate = new Date(fechaInicio);

            // Set times to midnight for clean day comparisons
            tempDate.setHours(0, 0, 0, 0);
            const hoyMidnight = new Date(hoy);
            hoyMidnight.setHours(0, 0, 0, 0);

            while (tempDate < hoyMidnight) {
                tempDate.setDate(tempDate.getDate() + 1);
                const dayOfWeek = tempDate.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // 0 = Domingo, 6 = Sábado
                    diasHabiles++;
                }
            }

            let estado = 'verde';
            let bgClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
            let icon = 'check-circle';

            if (diasHabiles === 2) {
                estado = 'amarillo';
                bgClass = 'bg-amber-100 text-amber-900 border-amber-300 animate-pulse';
                icon = 'alert-triangle';
            } else if (diasHabiles >= 3) {
                estado = 'rojo';
                bgClass = 'bg-rose-100 text-rose-900 border-rose-400 font-bold animate-bounce';
                icon = 'alert-octagon';
            }

            return {
                dias: diasHabiles,
                estado: estado,
                bgClass: bgClass,
                icon: icon,
                label: `${diasHabiles} día${diasHabiles === 1 ? '' : 's'} hábil${diasHabiles === 1 ? '' : 'es'}`
            };
        }

            handleLogin: async function(e) {
                if (e && e.preventDefault) e.preventDefault();
                try {
                    const uInput = (document.getElementById('login-username').value || '').trim();
                    const pInput = (document.getElementById('login-password').value || '').trim();

                    if (!uInput || !pInput) {
                        showAlert('Por favor ingrese usuario y contraseña.', 'error');
                        return;
                    }

                    // 1. Obtener lista actualizada de usuarios directamente desde Firebase Firestore si está disponible
                    if (window.isFirebaseConfigured && window.db) {
                        try {
                            const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                            const querySnapshot = await getDocs(collection(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users'));
                            const cloudUsers = [];
                            querySnapshot.forEach(doc => cloudUsers.push(doc.data()));
                            if (cloudUsers.length > 0) {
                                users = cloudUsers;
                                localStorage.setItem('tld_users', JSON.stringify(users));
                            }
                        } catch (fbErr) {
                            console.warn("No se pudo obtener usuarios en tiempo real de Firebase, usando copia local:", fbErr);
                        }
                    }

                    // Asegurar usuarios default de respaldo si la base de datos está totalmente vacía
                    ensureDefaultUsers();

                    // 2. Validar coincidencia de credenciales
                    const user = users.find(x => 
                        x && x.username && x.password &&
                        x.username.toString().trim().toLowerCase() === uInput.toLowerCase() && 
                        x.password.toString().trim() === pInput
                    );

                    if (!user) {
                        showAlert('Usuario o contraseña incorrectos.', 'error');
                        return;
                    }

                    if (user.status === 'Pendiente') {
                        showAlert('Tu usuario aún no ha sido autorizado por el Juez o Administrador. Por favor comunícate con la Ponencia.', 'error');
                        return;
                    }

                    currentUser = user;
                    saveState();
                    logAction(`Inicio de sesión exitoso en la plataforma.`);
                    showAlert(`Bienvenido/a, ${user.name}`, 'success');
                    this.renderDashboard();
                } catch (err) {
                    console.error("Error durante el inicio de sesión:", err);
                    ensureDefaultUsers();
                    showAlert('Error al procesar el inicio de sesión. Intente nuevamente.', 'error');
                }
            },

                        <!-- BARRA DE CUSTODIA, ACCIONES MASIVAS Y BÚSQUEDA -->

            // --- GENERAR FILAS DE TABLA CON CASILLA DE SELECCIÓN MASIVA Y OPCIÓN DE DEVOLUCIÓN ---
            getExpedientesTableRowsHtml: function(expList) {
                if (!expList || expList.length === 0) {
                    return `
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-500 font-medium">
                                No se encontraron expedientes que coincidan con los criterios.
                            </td>
                        </tr>
                    `;
                }

                return expList.map(exp => {
                    const statusClass = exp.estadoRecepcion === 'Pendiente_Aceptacion' ? 'bg-amber-50/70 border-l-4 border-amber-500' : 'bg-white';
                    const semaforo = calcularDiasHabilesTranscurridos(exp.fechaTurno);

                    return `
                        <tr class="${statusClass} hover:bg-slate-50 transition">
                            <td class="p-3 text-center">
                                <input type="checkbox" value="${exp.id}" onchange="app.updateBulkSelection()" class="exp-select-checkbox rounded text-amber-600 focus:ring-amber-500">
                            </td>
                            <td class="p-3 font-medium text-slate-900">
                                <div class="font-bold text-sm text-slate-900">${exp.numero}</div>
                                <div class="text-[11px] text-slate-500 font-normal">${exp.juicio}</div>
                                ${exp.expedienteVinculado ? `
                                    <div class="mt-1 inline-flex items-center text-[10px] bg-indigo-100 text-indigo-900 font-bold px-1.5 py-0.5 rounded border border-indigo-300">
                                        <i data-lucide="link" class="w-3 h-3 mr-1 text-indigo-600"></i>
                                        Vinc: ${exp.expedienteVinculado}
                                    </div>
                                ` : ''}
                                ${exp.amparoData && exp.amparoData.numeroAmparo ? `
                                    <div class="mt-1 inline-flex items-center text-[10px] bg-purple-100 text-purple-900 font-bold px-1.5 py-0.5 rounded border border-purple-300">
                                        <i data-lucide="scale" class="w-3 h-3 mr-1 text-purple-600"></i>
                                        ${exp.amparoData.tipoAmparo}: ${exp.amparoData.numeroAmparo}
                                    </div>
                                ` : ''}
                            </td>
                            <td class="p-3 whitespace-nowrap">
                                <div class="text-slate-700 font-semibold">${exp.fechaTurno || 'N/A'}</div>
                                <div class="mt-1 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold border ${semaforo.bgClass}">
                                    <i data-lucide="${semaforo.icon}" class="w-3 h-3 mr-1"></i>
                                    ${semaforo.label}
                                </div>
                            </td>
                            <td class="p-3">
                                <div class="text-slate-800 font-medium max-w-xs truncate" title="${exp.tareaPendiente}">
                                    ${exp.tareaPendiente || 'Sin acción asignada'}
                                </div>
                            </td>
                            <td class="p-3 text-center whitespace-nowrap">
                                <div class="flex items-center justify-center space-x-1">
                                    <button onclick="app.renderTrazabilidadModal('${exp.id}')" class="p-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg text-slate-700" title="Ver Historial de Trazabilidad">
                                        <i data-lucide="history" class="w-4 h-4"></i>
                                    </button>

                                    ${exp.areaActual === currentUser.area && exp.estadoRecepcion === 'Pendiente_Aceptacion' ? `
                                        <button onclick="app.handleAceptarExpediente('${exp.id}')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] rounded-lg shadow flex items-center space-x-1">
                                            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                                            <span>Recibir</span>
                                        </button>

                                        <!-- BOTÓN DE DEVOLUCIÓN / RECHAZO DE TURNO ERRÓNEO -->
                                        <button onclick="app.renderDevolverExpedienteModal('${exp.id}')" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold text-[11px] rounded-lg shadow flex items-center space-x-1" title="Devolver por turno erróneo">
                                            <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
                                            <span>Devolver</span>
                                        </button>
                                    ` : ''}

                                    ${exp.areaActual === currentUser.area && exp.estadoRecepcion === 'Aceptado' && (currentUser.role === 'Juez' || currentUser.role === 'Administrador' || !currentUser.permissions || currentUser.permissions.canTurnar) ? `
                                        <button onclick="app.renderTurnarExpedienteModal('${exp.id}')" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg shadow flex items-center space-x-1">
                                            <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                            <span>Turnar</span>
                                        </button>
                                    ` : ''}

                                    ${(currentUser.role === 'Juez' || currentUser.role === 'Administrador' || (currentUser.permissions && currentUser.permissions.canDelete)) ? `
                                        <button onclick="app.renderDeleteExpedienteModal('${exp.id}')" class="p-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-lg" title="Eliminar Expediente">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            },

            // --- MANEJO DE SELECCIÓN Y ACCIONES MASIVAS EN PAQUETE ---
            toggleSelectAllExpedientes: function(isChecked) {
                const checkboxes = document.querySelectorAll('.exp-select-checkbox');
                checkboxes.forEach(cb => cb.checked = isChecked);
                this.updateBulkSelection();
            },

            deselectAllExpedientes: function() {
                const allCb = document.getElementById('select-all-checkbox');
                if (allCb) allCb.checked = false;
                this.toggleSelectAllExpedientes(false);
            },

            updateBulkSelection: function() {
                const selected = Array.from(document.querySelectorAll('.exp-select-checkbox:checked')).map(cb => cb.value);
                const bar = document.getElementById('bulk-actions-bar');
                const badge = document.getElementById('bulk-count-badge');

                if (selected.length > 0) {
                    if (bar) bar.classList.remove('hidden');
                    if (badge) badge.textContent = selected.length;
                } else {
                    if (bar) bar.classList.add('hidden');
                }
            },

            renderBulkTurnoModal: function() {
                const selectedIds = Array.from(document.querySelectorAll('.exp-select-checkbox:checked')).map(cb => cb.value);
                if (selectedIds.length === 0) return;

                const content = `
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="send" class="w-5 h-5 text-amber-600"></i>
                                Turnar Paquete de Expedientes (${selectedIds.length})
                            </h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>
                        <form onsubmit="app.handleBulkTurnoSubmit(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="font-bold text-slate-700">Área Destino del Paquete:</label>
                                <select id="bulk-destino" required class="w-full p-2.5 border-2 border-amber-400 rounded bg-amber-50/40 font-bold text-slate-900">
                                    ${AREAS.map(a => `<option value="${a}">${a}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="font-bold text-slate-700">Nota Genérica / Instrucción General para el Paquete:</label>
                                <textarea id="bulk-tarea" required rows="3" placeholder="Indique la instrucción aplicable a todo el paquete de expedientes..." class="w-full p-2 border rounded font-sans"></textarea>
                            </div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded shadow">Remitir Paquete Completo</button>
                            </div>
                        </form>
                    </div>
                `;
                openModal(content);
            },

            handleBulkTurnoSubmit: async function(e) {
                e.preventDefault();
                const selectedIds = Array.from(document.querySelectorAll('.exp-select-checkbox:checked')).map(cb => cb.value);
                const destino = document.getElementById('bulk-destino').value;
                const tareaGen = document.getElementById('bulk-tarea').value.trim();
                const nowStr = new Date().toLocaleString('es-MX');

                selectedIds.forEach(id => {
                    const exp = expedientes.find(x => x.id === id);
                    if (exp) {
                        exp.areaActual = destino;
                        exp.estadoRecepcion = 'Pendiente_Aceptacion';
                        exp.fechaTurno = nowStr;
                        exp.tareaPendiente = tareaGen;
                        if (!exp.historial) exp.historial = [];
                        exp.historial.unshift({
                            fecha: nowStr,
                            usuario: `${currentUser.name} (${currentUser.role})`,
                            area: currentUser.area,
                            accion: `Turnado en Paquete hacia [${destino}] con instrucción genérica: "${tareaGen}"`
                        });

                        if (window.isFirebaseConfigured && window.db) {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                            });
                        }
                    }
                });

                saveState();
                logAction(`Turnado masivo de paquete de ${selectedIds.length} expedientes a ${destino}`);
                closeModal();
                showAlert(`Paquete de ${selectedIds.length} expedientes turnado exitosamente a ${destino}.`, 'success');
                this.renderDashboard();
            },

            handleBulkDelete: async function() {
                const selectedIds = Array.from(document.querySelectorAll('.exp-select-checkbox:checked')).map(cb => cb.value);
                if (selectedIds.length === 0) return;

                if (!confirm(`¿Está seguro de eliminar permanentemente el paquete de ${selectedIds.length} expedientes seleccionados?`)) return;

                selectedIds.forEach(id => {
                    const idx = expedientes.findIndex(e => e.id === id);
                    if (idx !== -1) {
                        expedientes.splice(idx, 1);
                        if (window.isFirebaseConfigured && window.db) {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, deleteDoc }) => {
                                deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', id));
                            });
                        }
                    }
                });

                saveState();
                logAction(`Eliminación masiva de ${selectedIds.length} expedientes por ${currentUser.name}`);
                showAlert(`Paquete de ${selectedIds.length} expedientes eliminado.`, 'info');
                this.renderDashboard();
            },

            // --- DEVOLVER / RECHAZAR TURNO ERRÓNEO ---
            renderDevolverExpedienteModal: function(expId) {
                const exp = expedientes.find(e => e.id === expId);
                if (!exp) return;

                // Detectar área previa del historial
                const areaPrevia = exp.historial && exp.historial.length > 1 ? exp.historial[1].area : 'Oficialía';

                const content = `
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-rose-700 flex items-center gap-2">
                                <i data-lucide="undo-2" class="w-5 h-5 text-rose-600"></i>
                                Devolver Expediente ${exp.numero} por Turno Erróneo
                            </h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>
                        <form onsubmit="app.handleDevolverSubmit(event, '${exp.id}')" class="space-y-3 text-xs">
                            <p class="text-slate-700 font-medium">
                                El expediente será retornado al área de origen: <strong>${areaPrevia}</strong>.
                            </p>
                            <div>
                                <label class="font-bold text-slate-700">Motivo de la Devolución o Rechazo:</label>
                                <textarea id="devolucion-motivo" required rows="3" placeholder="Especifique el motivo por el cual no corresponde el turno a esta área..." class="w-full p-2 border border-rose-300 rounded font-sans focus:ring-2 focus:ring-rose-500"></textarea>
                            </div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-rose-700 text-white font-bold rounded shadow">Confirmar Devolución</button>
                            </div>
                        </form>
                    </div>
                `;
                openModal(content);
            },

            handleDevolverSubmit: async function(e, expId) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === expId);
                if (!exp) return;

                const motivo = document.getElementById('devolucion-motivo').value.trim();
                const nowStr = new Date().toLocaleString('es-MX');
                const areaOrigen = exp.historial && exp.historial.length > 1 ? exp.historial[1].area : 'Oficialía';

                exp.areaActual = areaOrigen;
                exp.estadoRecepcion = 'Aceptado';
                exp.fechaTurno = nowStr;
                exp.tareaPendiente = `DEVOLUCIÓN / TURNO ERRÓNEO: ${motivo}`;

                if (!exp.historial) exp.historial = [];
                exp.historial.unshift({
                    fecha: nowStr,
                    usuario: `${currentUser.name} (${currentUser.role})`,
                    area: currentUser.area,
                    accion: `Turno rechazado y devuelto a [${areaOrigen}]. Motivo: "${motivo}"`
                });

                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                    } catch(err) { console.error("Error al devolver expediente en Firebase:", err); }
                }

                logAction(`Expediente ${exp.numero} devuelto a ${areaOrigen} por turno erróneo.`);
                closeModal();
                showAlert(`Expediente ${exp.numero} retornado a ${areaOrigen}.`, 'info');
                this.renderDashboard();
            },

            // --- IMPORTACIÓN MASIVA DESDE PLANTILLA EXCEL / CSV ---
            renderImportExcelModal: function() {
                const content = `
                    <div class="p-6 space-y-5 max-w-4xl w-full">

                            <div>
                                <h3 class="text-xl font-serif font-bold text-slate-900 flex items-center gap-2">

                                    Carga Masiva de Expedientes mediante Plantilla Excel

                        </div>

                        <!-- LAYOUT MEJOR DISTRIBUIDO EN 2 COLUMNAS SIMÉTRICAS -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            
                            <!-- COLUMNA IZQUIERDA: PLANTILLA Y CARGADOR DE ARCHIVOS -->
                            <div class="space-y-4 flex flex-col justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div class="space-y-3">
                                    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-900 text-xs font-medium space-y-1">
                                        <div class="font-bold flex items-center gap-1">
                                            <i data-lucide="info" class="w-4 h-4 text-emerald-700"></i>
                                            Instrucciones para Plantilla
                                        </div>
                                        <p>Respeta la estructura de columnas al exportar desde Excel:</p>
                                        <code class="block p-1.5 bg-white border rounded text-[10px] font-mono text-slate-800">
                                            [Número] , [Juicio] , [Actor] , [Demandado] , [Área] , [Trámite]
                                        </code>
                                    </div>

                                    <button onclick="app.downloadTemplateExcel()" class="w-full py-2.5 px-3 bg-white hover:bg-emerald-50 text-emerald-800 font-bold border-2 border-emerald-600 rounded-xl shadow-sm flex items-center justify-center gap-2 text-xs transition">
                                        <i data-lucide="file-spread-sheet" class="w-4 h-4 text-emerald-600"></i>
                                        <span>Descargar Plantilla Oficial (.CSV)</span>

            handleImportExcelSubmit: async function() {
                const text = (document.getElementById('excel-paste-input')?.value || '').trim();
                if (!text) {
                    showAlert('Ingrese las filas de datos desde Excel para procesar.', 'error');
                    return;
                }

                const lines = text.split(/\r?\n/);
                let count = 0;
                const nowStr = new Date().toLocaleString('es-MX');

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    // Omitir automáticamente la fila de encabezados si proviene de la plantilla
                    if (i === 0 && (line.toLowerCase().includes('numero_expediente') || line.toLowerCase().includes('tipo_juicio'))) {
                        continue;
                    }

                    const delimiter = line.includes('\t') ? '\t' : ',';
                    const cols = line.split(delimiter).map(c => c.trim().replace(/^"|"$/g, ''));

                    if (cols.length >= 4 && cols[0]) {
                        const newExp = {
                            id: 'exp-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                            numero: cols[0] || `S/N-${Date.now()}`,
                            juicio: cols[1] || 'Ordinario Laboral Burocrático',
                            actor: cols[2] || 'No especificado',
                            demandado: cols[3] || 'No especificado',
                            areaActual: cols[4] && AREAS.includes(cols[4]) ? cols[4] : currentUser.area,
                            estadoRecepcion: 'Aceptado',
                            fechaTurno: nowStr,
                            tareaPendiente: cols[5] || 'Carga masiva desde plantilla Excel',
                            historial: [
                                { fecha: nowStr, usuario: `${currentUser.name} (${currentUser.role})`, area: currentUser.area, accion: `Alta masiva vía Plantilla Excel.` }
                            ]
                        };

                        expedientes.unshift(newExp);
                        count++;

                        if (window.isFirebaseConfigured && window.db) {
                            try {
                                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                                await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', newExp.id), newExp);
                            } catch(err) { console.error("Error sincronizando importación masiva:", err); }
                        }
                    }
                }

                if (count === 0) {
                    showAlert('No se pudieron procesar filas válidas. Verifique el formato e intente nuevamente.', 'error');
                    return;
                }

                saveState();
                logAction(`Carga masiva realizada: ${count} expedientes registrados desde Excel.`);
                closeModal();
                showAlert(`Se registraron ${count} expedientes desde la plantilla Excel exitosamente.`, 'success');
                this.renderDashboard();
            },

            downloadExcelReport: function() {
                try {
                    let csvStr = "\uFEFFNumero_Expediente,Tipo_Juicio,Actor,Demandado,Area_Custodia_Actual,Dias_Habiles_Transcurridos,Semaforo,Tarea_Pendiente\n";

                    expedientes.forEach(e => {
                        const sem = calcularDiasHabilesTranscurridos(e.fechaTurno);
                        const cleanNum = `"${(e.numero || '').replace(/"/g, '""')}"`;
                        const cleanJuicio = `"${(e.juicio || '').replace(/"/g, '""')}"`;
                        const cleanActor = `"${(e.actor || '').replace(/"/g, '""')}"`;
                        const cleanDemandado = `"${(e.demandado || '').replace(/"/g, '""')}"`;
                        const cleanArea = `"${(e.areaActual || '').replace(/"/g, '""')}"`;
                        const cleanTarea = `"${(e.tareaPendiente || '').replace(/"/g, '""')}"`;

                        csvStr += `${cleanNum},${cleanJuicio},${cleanActor},${cleanDemandado},${cleanArea},${sem.dias},${sem.estado.toUpperCase()},${cleanTarea}\n`;
                    });

                    // Blob seguro con compatibilidad completa para iFrames y navegadores
                    const blob = new Blob([csvStr], { type: 'text/csv;charset=utf-8;' });
                    const fileName = `Reporte_Expedientes_Ponencia3_${new Date().toISOString().substring(0, 10)}.csv`;

                    if (navigator.msSaveBlob) { // Para compatibilidad con Edge / IE antiguos
                        navigator.msSaveBlob(blob, fileName);
                    } else {
                        const link = document.createElement("a");
                        const url = URL.createObjectURL(blob);
                        link.setAttribute("href", url);
                        link.setAttribute("download", fileName);
                        link.style.visibility = 'hidden';
                        document.body.appendChild(link);
                        link.click();
                        setTimeout(() => {
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        }, 100);
                    }

                    logAction(`Reporte consolidado extraído y descargado en Excel (.csv) por ${currentUser ? currentUser.name : 'Usuario'}`);
                    showAlert('Reporte descargado exitosamente en formato Excel.', 'success');
                } catch (err) {
                    console.error("Error descargando el archivo Excel:", err);
                    showAlert('Ocurrió un error al intentar descargar el archivo Excel.', 'error');
                }
            },

                const container = document.getElementById('coincidencias-container');

                if ((!actorVal || actorVal.length < 3) && (!demandadoVal || demandadoVal.length < 3)) {
                    if (container) container.classList.add('hidden');
                    return;
                }

                const matches = expedientes.filter(e => {
                    const matchActor = actorVal.length >= 3 && e.actor && e.actor.toLowerCase().includes(actorVal);
                    const matchDemandado = demandadoVal.length >= 3 && e.demandado && e.demandado.toLowerCase().includes(demandadoVal);
                    return matchActor || matchDemandado;
                });

                if (matches.length > 0) {
                    if (container) container.classList.remove('hidden');

                        list.innerHTML = matches.map(m => `

            handleSaveTurno: async function(e, expId) {
                e.preventDefault();

                const destino = document.getElementById('turno-destino').value;
                const tarea = document.getElementById('turno-tarea').value.trim();
                const nowStr = new Date().toLocaleString('es-MX');

                exp.areaActual = destino;

                exp.fechaTurno = nowStr;
                exp.tareaPendiente = tarea;

                if (!exp.historial) exp.historial = [];

                this.renderDashboard();

            handleDeleteUsuario: async function(userId) {
                const passInput = (document.getElementById('delete-user-password')?.value || '').trim();

                if (!passInput) {
                    showAlert('Debe ingresar su contraseña para confirmar la eliminación del usuario.', 'error');
                    return;
                }

                if (passInput !== currentUser.password) {
                    showAlert('Contraseña incorrecta. Se canceló la baja del usuario por seguridad.', 'error');
                    return;
                }

                const idx = users.findIndex(u => u.id === userId);
                if (idx === -1) return;

                const targetUser = users[idx];
                users.splice(idx, 1);
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', userId));
                    } catch (e) {
                        console.warn("Error eliminando usuario en Firebase:", e);
                    }
                }

                logAction(`Servidor público ${targetUser.name} (@${targetUser.username}) eliminado por ${currentUser.name} tras verificación de contraseña.`);
                closeModal();
                showAlert(`El servidor público ${targetUser.name} ha sido dado de baja.`, 'info');
                this.renderAdminPanel();
            },

            // ACTIVAR O DESACTIVAR HABILIDADES/PERMISOS ESPECÍFICOS POR USUARIO
            togglePermisoUsuario: function(userId, permKey, isChecked) {
                const targetUser = users.find(u => u.id === userId);
                if (!targetUser) return;

                if (targetUser.role === 'Juez') {
                    showAlert('Las habilidades del Juez son jerárquicas e inalterables.', 'error');
                    return;
                }

                if (!targetUser.permissions) {
                    targetUser.permissions = { canRegister: false, canTurnar: true, canRecibir: true, canDelete: false, canViewAudit: false };
                }

                targetUser.permissions[permKey] = isChecked;
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                        setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', targetUser.id), targetUser);
                    });
                }

                logAction(`Actualización de permisos para ${targetUser.name}: ${permKey} = ${isChecked}`);
                showAlert(`Permiso actualizado para ${targetUser.name}`, 'success');
            },

            cambiarAreaUsuario: function(userId, nuevaArea) {
                const targetUser = users.find(u => u.id === userId);
                if (!targetUser) return;

                targetUser.area = nuevaArea;
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                        setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', targetUser.id), targetUser);
                    });
                }

                logAction(`Reasignación de área para ${targetUser.name} a: ${nuevaArea}`);
                showAlert(`Área actualizada a ${nuevaArea} para ${targetUser.name}`, 'success');
                this.renderDashboard();
            },

            aprobarUsuario: function(userId) {
                const u = users.find(x => x.id === userId);
                if (!u) return;

                u.status = 'Activo';
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                        setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', u.id), u);
                    });
                }

                logAction(`Usuario ${u.username} aprobado por ${currentUser.name}`);
                showAlert(`Usuario ${u.name} aprobado exitosamente.`, 'success');
                this.renderAdminPanel();
            },

            rechazarUsuario: async function(userId) {
                const idx = users.findIndex(x => x.id === userId);
                if (idx === -1) return;

                const u = users[idx];
                users.splice(idx, 1);
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', userId));
                    } catch (e) { console.error("Error eliminando en Firebase:", e); }
                }

                logAction(`Solicitud de usuario ${u.username} rechazada.`);
                showAlert(`Solicitud de ${u.name} rechazada y removida.`, 'info');
                this.renderAdminPanel();
            },

            renderRegisterModal: function() {
                const content = `
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-slate-900">Solicitar Registro de Servidor Público</h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>
                        <form onsubmit="app.handleRegisterSubmit(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="font-bold text-slate-700">Nombre Completo:</label>
                                <input type="text" id="reg-fullname" required placeholder="Ej. Lic. Carlos Ramírez" class="w-full p-2 border rounded font-semibold text-slate-900">

                                </div>
                                <div>

                            <div>
                                <label class="font-bold text-slate-700">Correo Electrónico Oficial:</label>
                                <input type="email" id="reg-email" required placeholder="correo@tribunallaboraldurango.gob.mx" class="w-full p-2 border rounded">
                            </div>
                            <div class="p-3 bg-amber-50 border border-amber-200 rounded text-[11px] text-amber-900">
                                ⚠️ Su solicitud será enviada al Juez y al Administrador para su validación y autorización previa.
                            </div>
                            <div class="flex justify-end space-x-2 pt-2">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded shadow">Enviar Solicitud</button>
                            </div>
                        </form>
                    </div>
                `;
                openModal(content);
            },

            handleRegisterSubmit: async function(e) {
                e.preventDefault();
                const name = document.getElementById('reg-fullname').value.trim();
                const username = document.getElementById('reg-username').value.trim();
                const password = document.getElementById('reg-password').value.trim();
                const role = document.getElementById('reg-role').value;
                const area = document.getElementById('reg-area').value;
                const email = document.getElementById('reg-email').value.trim();

                const existing = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.status !== 'Rechazado');
                if (existing) {
                    showAlert('El nombre de usuario ya se encuentra registrado o pendiente de aprobación.', 'error');
                    return;
                }

                const newUser = {
                    id: 'u-' + Date.now(),
                    name: name,
                    username: username,
                    password: password,
                    role: role,
                    area: area,
                    email: email,
                    status: 'Pendiente',
                    fechaAlta: new Date().toISOString().substring(0, 10),
                    permissions: {
                        canRegister: role === 'Oficial' || role === 'Juez' || role === 'Administrador',
                        canTurnar: true,
                        canRecibir: true,
                        canDelete: false,
                        canViewAudit: false
                    }
                };

                users.push(newUser);
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', newUser.id), newUser);
                    } catch (err) { console.error("Error guardando registro en Firebase:", err); }
                }

                logAction(`Solicitud de registro enviada para ${username}`);
                closeModal();
                showAlert('Solicitud de registro enviada exitosamente. Espere la aprobación del Juez.', 'success');
            },

            renderAuditLogModal: function() {
                const content = `
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="shield-check" class="w-5 h-5 text-amber-600"></i>
                                Bitácora de Auditoría Unalterable

                        <div class="space-y-2 max-h-80 overflow-y-auto font-mono text-xs">

                `;
                openModal(content);
            },

            renderDeleteExpedienteModal: function(expId) {
                const exp = expedientes.find(e => e.id === expId);
                if (!exp) return;

                const content = `
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-rose-700 flex items-center gap-2">
                                <i data-lucide="shield-alert" class="w-5 h-5 text-rose-600"></i>
                                Eliminar Expediente ${exp.numero}
                            </h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>
                        <p class="text-xs text-slate-700 font-medium">
                            ¿Está seguro de eliminar permanentemente el expediente <strong>${exp.numero}</strong>? Esta acción requerirá confirmación mediante su contraseña de usuario por seguridad.
                        </p>

                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-slate-800">Ingrese su contraseña para confirmar:</label>
                            <input type="password" id="delete-confirm-password" placeholder="••••••••" 
                                class="w-full p-2.5 border-2 border-rose-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-rose-500 focus:outline-none">
                        </div>

                        <div class="flex justify-end space-x-2 pt-3">
                            <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded font-bold text-xs">Cancelar</button>
                            <button onclick="app.handleDeleteExpediente('${exp.id}')" class="px-4 py-1.5 bg-rose-700 hover:bg-rose-800 text-white font-bold text-xs rounded shadow">Confirmar y Eliminar</button>
                        </div>
                    </div>
                `;
                openModal(content);
            },

            handleDeleteExpediente: async function(expId) {
                const passInput = (document.getElementById('delete-confirm-password')?.value || '').trim();

                if (!passInput) {
                    showAlert('Debe ingresar su contraseña para confirmar la eliminación.', 'error');
                    return;
                }

                if (passInput !== currentUser.password) {
                    showAlert('Contraseña incorrecta. Se canceló la eliminación por seguridad.', 'error');
                    return;
                }

                const idx = expedientes.findIndex(e => e.id === expId);
                if (idx === -1) return;

                const exp = expedientes[idx];
                expedientes.splice(idx, 1);
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', expId));
                    } catch(e) {
                        console.warn("Sincronización remota restringida por reglas de Firestore (Permisos). Cambio guardado localmente:", e);
                    }
                }

                logAction(`Expediente ${exp.numero} eliminado permanentemente por ${currentUser.name} tras validación de contraseña.`);
                closeModal();
                showAlert(`Expediente ${exp.numero} eliminado exitosamente.`, 'info');
                this.renderDashboard();
            }
        };

        // UI HELPER FUNCTIONS
        function openModal(contentHtml) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (container && content) {
                content.innerHTML = contentHtml;
                container.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.classList.add('hidden');
        }

        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-800 text-white' : type === 'error' ? 'bg-rose-800 text-white' : 'bg-slate-800 text-amber-300';
            toast.className = `${bg} px-4 py-3 rounded-lg shadow-2xl border border-amber-500/30 text-xs font-bold pointer-events-auto transition duration-300 transform translate-y-2`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        window.onload = function() {
            app.init();
        };
    </script>

        // FUNCIÓN GLOBAL PARA ENVIAR CORREOS REALES
        async function sendRealEmail(toEmail, toName, subject, codeOrMessage) {
            if (!emailJsConfig.active || !emailJsConfig.publicKey || emailJsConfig.publicKey === 'YOUR_PUBLIC_KEY') {
                console.log(`[Modo Simulación - Correo a ${toEmail}]: ${subject} - ${codeOrMessage}`);
                return { success: true, simulated: true };
            }

            try {
                const response = await emailjs.send(
                    emailJsConfig.serviceId,
                    emailJsConfig.templateId,
                    {
                        to_email: toEmail,
                        to_name: toName,
                        subject: subject,
                        message: codeOrMessage,
                        code: codeOrMessage
                    }
                );
                return { success: true, response };
            } catch (error) {
                console.error("Error al enviar correo vía EmailJS:", error);

        // GARANTIZAR QUE SIEMPRE EXISTAN Y ESTÉN ACTIVOS LOS USUARIOS BASE
        function ensureDefaultUsers() {
            if (!Array.isArray(users) || users.length === 0) {
                users = JSON.parse(JSON.stringify(DEFAULT_USERS));
            } else {
                DEFAULT_USERS.forEach(defaultUser => {
                    const idx = users.findIndex(u => u && u.username && u.username.toLowerCase() === defaultUser.username.toLowerCase());
                    if (idx === -1) {
                        users.push(JSON.parse(JSON.stringify(defaultUser)));
                    } else {
                        users[idx].status = 'Activo';
                        users[idx].password = defaultUser.password;
                    }
                });
            }
            // Asignar permisos por defecto si no existen
            users.forEach(u => {
                if (!u.permissions) {
                    if (u.role === 'Juez' || u.role === 'Administrador') {
                        u.permissions = { canRegister: true, canEdit: true, canTurnar: true, canRecibir: true, canDelete: true, canManageAmparo: true, canViewAudit: true };
                    } else if (u.role === 'Secretaria_Acuerdos' || u.role === 'Encargado_Amparo') {
                        u.permissions = { canRegister: true, canEdit: true, canTurnar: true, canRecibir: true, canDelete: false, canManageAmparo: true, canViewAudit: false };
                    } else {
                        u.permissions = { canRegister: false, canEdit: true, canTurnar: true, canRecibir: true, canDelete: false, canManageAmparo: false, canViewAudit: false };
                    }
                } else {
                    if (u.permissions.canEdit === undefined) u.permissions.canEdit = true;
                    if (u.permissions.canManageAmparo === undefined) u.permissions.canManageAmparo = (u.role === 'Juez' || u.role === 'Administrador' || u.role === 'Secretaria_Acuerdos' || u.role === 'Encargado_Amparo');
                }
            });
            saveState();
        }

        // UNEDITABLE AUDIT LOGGER
        function logAction(actionDescription) {
            const newLog = {
                id: 'log-' + Date.now(),
                fecha: new Date().toLocaleString('es-MX'),
                timestamp: Date.now(),
                usuario: currentUser ? `${currentUser.name} (${currentUser.username})` : 'Sistema / Anónimo',
                accion: actionDescription,
                area: currentUser ? currentUser.area : 'N/A'
            };
            auditLogs.unshift(newLog);
            cleanOldAuditLogs();
            saveState();

            // Sincronización en la nube si Firebase está activo
            if (window.isFirebaseConfigured && window.db) {
                try {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                        setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'audit_logs', newLog.id), newLog);
                    });
                } catch(err) { console.error("Error sincronizando log en Firebase:", err); }
            }
        }

        // LIMPIEZA / DEPURACIÓN AUTOMÁTICA DE REGISTROS MAYORES A 1 AÑO (365 DÍAS)
        function cleanOldAuditLogs() {
            const ONE_YEAR_MS = 365 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            auditLogs = auditLogs.filter(log => {
                if (!log.timestamp) return true; // Mantener logs sin marca de tiempo para seguridad
                return (now - log.timestamp) <= ONE_YEAR_MS;
            });
        }

        // CÁLCULO DE DÍAS HÁBILES TRANSCURRIDOS (EXCLUYE SÁBADOS Y DOMINGOS)
        function calcularDiasHabilesTranscurridos(fechaTurnoStr) {
            if (!fechaTurnoStr) return { dias: 0, estado: 'verde', label: '0 días hábiles' };

            let fechaInicio;
            try {
                // Parse format "YYYY-MM-DD HH:MM" or "DD/MM/YYYY HH:MM"
                const parts = fechaTurnoStr.split(' ');
                const dateParts = parts[0].includes('/') ? parts[0].split('/') : parts[0].split('-');
                if (dateParts[0].length === 4) {
                    fechaInicio = new Date(`${dateParts[0]}-${dateParts[1]}-${dateParts[2]}T${parts[1] || '08:00'}`);
                } else {
                    fechaInicio = new Date(`${dateParts[2]}-${dateParts[1]}-${dateParts[0]}T${parts[1] || '08:00'}`);
                }
            } catch (err) {
                fechaInicio = new Date();
            }

            if (isNaN(fechaInicio.getTime())) fechaInicio = new Date();

            const hoy = new Date();
            let diasHabiles = 0;
            let tempDate = new Date(fechaInicio);

            // Set times to midnight for clean day comparisons
            tempDate.setHours(0, 0, 0, 0);
            const hoyMidnight = new Date(hoy);
            hoyMidnight.setHours(0, 0, 0, 0);

            while (tempDate < hoyMidnight) {
                tempDate.setDate(tempDate.getDate() + 1);
                const dayOfWeek = tempDate.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) { // 0 = Domingo, 6 = Sábado
                    diasHabiles++;
                }
            }

            let estado = 'verde';
            let bgClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
            let icon = 'check-circle';

            if (diasHabiles === 2) {
                estado = 'amarillo';
                bgClass = 'bg-amber-100 text-amber-900 border-amber-300 animate-pulse';
                icon = 'alert-triangle';
            } else if (diasHabiles >= 3) {
                estado = 'rojo';
                bgClass = 'bg-rose-100 text-rose-900 border-rose-400 font-bold animate-bounce';
                icon = 'alert-octagon';
            }

            return {
                dias: diasHabiles,
                estado: estado,
                bgClass: bgClass,
                icon: icon,
                label: `${diasHabiles} día${diasHabiles === 1 ? '' : 's'} hábil${diasHabiles === 1 ? '' : 'es'}`
            };
        }

            handleSendRecoveryCode: async function(e) {
                e.preventDefault();
                const idStr = document.getElementById('recovery-identifier').value.trim().toLowerCase();

                const user = users.find(u => u && ((u.email && u.email.toLowerCase() === idStr) || (u.username && u.username.toLowerCase() === idStr)));

                if (!user) {
                    showAlert('No se encontró ningún servidor público con ese usuario o correo.', 'error');
                    return;
                }

                // Generar código numérico de 6 dígitos con 15 min de vigencia (900,000 ms)
                const tempCode = Math.floor(100000 + Math.random() * 900000).toString();
                const expireTimestamp = Date.now() + 15 * 60 * 1000;

                user.recoveryCode = tempCode;
                user.recoveryExpire = expireTimestamp;
                saveState();

                logAction(`Solicitud de clave temporal de recuperación para ${user.name} (${user.username})`);

                // Enviar correo real con EmailJS o Simulación
                const emailResult = await sendRealEmail(
                    user.email,
                    user.name,
                    'Código de Recuperación - Control de Expedientes Ponencia 3',
                    `Su código de recuperación temporal es: ${tempCode}. Válido por 15 minutos.`
                );

                if (emailResult.success && !emailResult.simulated) {
                    showAlert(`Correo enviado exitosamente a ${user.email}`, 'success');
                }

                this.renderValidateRecoveryCodeModal(user.id, user.email, tempCode, emailResult.simulated);
            },

            handleVerifyRecoveryCode: async function(e, userId) {
                e.preventDefault();
                const codeInp = document.getElementById('verify-temp-code').value.trim();
                const newPw = document.getElementById('new-reset-password').value;

                const u = users.find(x => x.id === userId);
                if (!u) {
                    showAlert('Usuario no encontrado.', 'error');
                    return;
                }

                if (!u.recoveryCode || u.recoveryCode !== codeInp) {
                    showAlert('La clave temporal ingresada es incorrecta.', 'error');
                    return;
                }

                if (Date.now() > u.recoveryExpire) {
                    showAlert('La clave temporal ha expirado (límite de 15 minutos superado). Solicite una nueva.', 'error');
                    return;
                }

                // Actualización exitosa de contraseña
                u.password = newPw;
                u.recoveryCode = null;
                u.recoveryExpire = null;
                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'users', u.id), u);
                    } catch(err) { console.error("Error al actualizar contraseña en Firebase:", err); }
                }

                logAction(`Restablecimiento de contraseña exitoso para ${u.name} (${u.username})`);
                closeModal();
                showAlert(`Contraseña de ${u.name} actualizada correctamente. Ya puede iniciar sesión.`, 'success');

                currentUser = u;
                saveState();
                this.renderDashboard();
            },

            handleSaveEditExpediente: async function(e, expId) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === expId);
                if (!exp) return;

                const num = document.getElementById('edit-exp-num').value.trim();
                const juicio = document.getElementById('edit-exp-juicio').value;
                const actor = document.getElementById('edit-exp-actor').value.trim();
                const demandado = document.getElementById('edit-exp-demandado').value.trim();
                const tarea = document.getElementById('edit-exp-tarea').value.trim();
                const nuevoVinculado = document.getElementById('edit-exp-vinculado').value.trim();

                const ampTipo = document.getElementById('edit-amparo-tipo').value;
                const ampNum = document.getElementById('edit-amparo-num').value.trim();
                const ampVenc = document.getElementById('edit-amparo-vencimiento').value;
                const ampOrgano = document.getElementById('edit-amparo-organo').value;

                const anteriorVinculado = exp.expedienteVinculado;
                const nowStr = new Date().toLocaleString('es-MX');
                let cambiosAuditoria = [];

                // DETECCIÓN DE CAMBIO / DESVINCULACIÓN DE EXPEDIENTE
                if (anteriorVinculado && !nuevoVinculado) {
                    exp.expedienteVinculado = null;
                    cambiosAuditoria.push(`Desvinculación del expediente antecedente '${anteriorVinculado}'`);
                } else if (nuevoVinculado !== anteriorVinculado) {
                    exp.expedienteVinculado = nuevoVinculado;
                    cambiosAuditoria.push(`Nueva vinculación con el expediente antecedente '${nuevoVinculado}'`);
                }

                if (exp.numero !== num) cambiosAuditoria.push(`Cambio de número: '${exp.numero}' -> '${num}'`);
                if (exp.actor !== actor) cambiosAuditoria.push(`Modificación de Parte Actora`);
                if (exp.demandado !== demandado) cambiosAuditoria.push(`Modificación de Parte Demandada`);
                if (exp.juicio !== juicio) cambiosAuditoria.push(`Cambio de tipo de juicio: '${juicio}'`);

                exp.numero = num;
                exp.juicio = juicio;
                exp.actor = actor;
                exp.demandado = demandado;
                exp.tareaPendiente = tarea;

                if (ampNum && ampTipo) {
                    exp.amparoData = {
                        tipoAmparo: ampTipo,
                        numeroAmparo: ampNum,
                        fechaVencimiento: ampVenc || null,
                        organoJurisdiccional: ampOrgano
                    };
                    cambiosAuditoria.push(`Actualización de Juicio de Amparo '${ampNum}' (${ampTipo})`);
                } else {
                    exp.amparoData = null;
                }

                // REGISTRO EN HISTORIAL DEL EXPEDIENTE
                if (!exp.historial) exp.historial = [];
                const detalleCambios = cambiosAuditoria.length > 0 ? cambiosAuditoria.join(', ') : 'Modificación de expediente';
                
                exp.historial.unshift({
                    fecha: nowStr,
                    usuario: `${currentUser.name} (${currentUser.role})`,
                    area: currentUser.area,
                    accion: detalleCambios
                });

                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                    } catch(err) { console.error("Error al guardar edición en Firebase:", err); }
                }

                logAction(`Edición realizada en expediente ${exp.numero} por ${currentUser.name}: ${detalleCambios}`);
                closeModal();
                showAlert(`Expediente ${exp.numero} actualizado exitosamente.`, 'success');
                this.renderDashboard();
            },

            getAuditLogsRowsHtml: function(logs) {
                if (!logs || logs.length === 0) {

                return logs.map(l => `

                        <td class="p-3 font-bold text-slate-900">${l.usuario}</td>

                    </tr>
                `).join('');

            getFilteredAuditLogs: function() {
                const userSel = document.getElementById('audit-user-filter')?.value || 'ALL';
                const monthSel = document.getElementById('audit-month-filter')?.value || 'ALL';
                const yearSel = document.getElementById('audit-year-filter')?.value || 'ALL';

                return auditLogs.filter(l => {
                    // Filtro por Servidor Público
                    if (userSel !== 'ALL' && (!l.usuario || !l.usuario.includes(userSel))) {
                        return false;
                    }

                    // Parse fecha "DD/MM/YYYY" o ISO "YYYY-MM-DD"
                    if (l.fecha) {
                        const dateParts = l.fecha.split(',')[0].split('/');
                        if (dateParts.length === 3) {
                            const m = parseInt(dateParts[1], 10);
                            const y = parseInt(dateParts[2], 10);

                            if (monthSel !== 'ALL' && m !== parseInt(monthSel, 10)) return false;
                            if (yearSel !== 'ALL' && y !== parseInt(yearSel, 10)) return false;
                        }
                    }
                    return true;
                });
            },

            filterAuditLogs: function() {
                const filtered = this.getFilteredAuditLogs();
                const tbody = document.getElementById('audit-logs-table-body');
                const badge = document.getElementById('audit-count-badge');

                if (tbody) tbody.innerHTML = this.getAuditLogsRowsHtml(filtered);
                if (badge) badge.textContent = `Mostrando ${filtered.length} de ${auditLogs.length} actividades acumuladas`;
            },

            downloadAuditLogsExcel: function() {
                try {
                    const filtered = this.getFilteredAuditLogs();
                    if (filtered.length === 0) {
                        showAlert('No hay registros en la bitácora para exportar.', 'error');
                        return;
                    }

                    const userSel = document.getElementById('audit-user-filter')?.value || 'Todos';
                    const monthSel = document.getElementById('audit-month-filter')?.value || 'General';
                    const yearSel = document.getElementById('audit-year-filter')?.value || 'Ano';

                    let csvContent = "\uFEFF";
                    csvContent += "Fecha_y_Hora,Servidor_Publico,Area_Adscrita,Accion_Registrada\n";

                    filtered.forEach(l => {
                        const cleanFecha = (l.fecha || '').replace(/"/g, '""');
                        const cleanUser = (l.usuario || '').replace(/"/g, '""');
                        const cleanArea = (l.area || '').replace(/"/g, '""');
                        const cleanAccion = (l.accion || '').replace(/"/g, '""');

                        csvContent += `"${cleanFecha}","${cleanUser}","${cleanArea}","${cleanAccion}"\n`;
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `Bitacora_Actividades_${monthSel}_${yearSel}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    logAction(`Descarga de bitácora mensual efectuada por ${currentUser.name}`);
                    showAlert('Bitácora mensual descargada con éxito.', 'success');
                } catch(err) {
                    console.error("Error al descargar bitácora:", err);
                    showAlert('Error al descargar la bitácora.', 'error');
                }
            },

            handleBulkTurnoSubmit: async function(e) {
                e.preventDefault();

                const instruccion = document.getElementById('bulk-instruccion').value.trim();

                            usuario: `${currentUser.name} (${currentUser.role})`,
                            area: destino,
                            accion: `Turnado en paquete a ${destino}. Nota: ${instruccion}`

                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);

                    }
                });

                showAlert(`Paquete de ${selectedIds.length} expedientes turnado a ${destino}`, 'success');
                this.renderDashboard();
            },

            handleBulkDelete: async function() {
                const selectedIds = this.getSelectedExpedienteIds();
                if (selectedIds.length === 0) return;

                const confirmPass = prompt(`Para eliminar permanentemente ${selectedIds.length} expedientes, ingrese su contraseña:`);
                if (confirmPass !== currentUser.password) {
                    showAlert('Contraseña incorrecta. Acción cancelada.', 'error');
                    return;
                }

                selectedIds.forEach(id => {
                    const idx = expedientes.findIndex(x => x.id === id);
                    if (idx !== -1) {
                        expedientes.splice(idx, 1);
                        if (window.isFirebaseConfigured && window.db) {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, deleteDoc }) => {
                                deleteDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', id));
                            });
                        }
                    }
                });

                saveState();
                logAction(`Eliminación en paquete de ${selectedIds.length} expedientes efectuada por ${currentUser.name}`);
                showAlert(`Se eliminaron ${selectedIds.length} expedientes del sistema.`, 'info');
                this.renderDashboard();

            handleDevolverSubmit: async function(e, expId) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === expId);
                if (!exp) return;

                const motivo = document.getElementById('motivo-devolucion').value.trim();
                const origenArea = exp.historial && exp.historial.length > 1 ? exp.historial[1].area : 'Oficialía';
                const nowStr = new Date().toLocaleString('es-MX');

                exp.areaActual = origenArea;
                exp.estadoRecepcion = 'Pendiente_Aceptacion';
                exp.fechaTurno = nowStr;
                exp.tareaPendiente = `RECHAZADO/DEVUELTO por ${currentUser.area}: ${motivo}`;

                if (!exp.historial) exp.historial = [];
                exp.historial.unshift({
                    fecha: nowStr,
                    usuario: `${currentUser.name} (${currentUser.role})`,
                    area: origenArea,
                    accion: `Devolución de expediente a ${origenArea}. Causa: ${motivo}`
                });

                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                    } catch(err) { console.error("Error al devolver expediente en Firebase:", err); }

                logAction(`Expediente ${exp.numero} devuelto a ${origenArea} por ${currentUser.name}`);
                closeModal();
                showAlert(`Expediente retornado a ${origenArea}`, 'info');
                this.renderDashboard();
            },

            // --- EXPORTAR REPORTES EN FORMATO EXCEL COMPATIBLE (.CSV) ---
            downloadExcelReport: function() {
                try {
                    let csvContent = "\uFEFF"; // Byte Order Mark para compatibilidad con caracteres en Excel
                    csvContent += "Numero_Expediente,Tipo_Juicio,Parte_Actora,Parte_Demandada,Area_Ubicacion,Estado_Recepcion,Fecha_Ultimo_Turno,Dias_Habiles_Transcurridos,Semaforo,Tarea_Pendiente\n";

                    expedientes.forEach(e => {
                        const sem = calcularDiasHabilesTranscurridos(e.fechaTurno);
                        const cleanNum = (e.numero || '').replace(/"/g, '""');
                        const cleanJuicio = (e.juicio || '').replace(/"/g, '""');
                        const cleanActor = (e.actor || '').replace(/"/g, '""');
                        const cleanDemandado = (e.demandado || '').replace(/"/g, '""');
                        const cleanArea = (e.areaActual || '').replace(/"/g, '""');
                        const cleanEstado = (e.estadoRecepcion || '').replace(/"/g, '""');
                        const cleanFecha = (e.fechaTurno || '').replace(/"/g, '""');
                        const cleanTarea = (e.tareaPendiente || '').replace(/"/g, '""');

                        csvContent += `"${cleanNum}","${cleanJuicio}","${cleanActor}","${cleanDemandado}","${cleanArea}","${cleanEstado}","${cleanFecha}",${sem.dias},"${sem.estado}","${cleanTarea}"\n`;
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `Reporte_Expedientes_Ponencia_3_${new Date().toISOString().substring(0,10)}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    logAction(`Descarga de Reporte General en formato Excel efectuada por ${currentUser.name}`);
                    showAlert('Reporte descargado correctamente en formato Excel (.csv)', 'success');
                } catch(err) {
                    console.error("Error al descargar Excel:", err);
                    showAlert('Error al exportar reporte. Intente nuevamente.', 'error');
                }
            },

            processExcelImport: async function() {
                const text = (document.getElementById('import-excel-text')?.value || '').trim();
                if (!text) {
                    showAlert('Ingrese o cargue información para procesar la importación.', 'error');
                    return;
                }

                const lines = text.split('\n');
                let importedCount = 0;
                const nowStr = new Date().toLocaleString('es-MX');

                lines.forEach((line, idx) => {
                    if (!line.trim()) return;
                    if (idx === 0 && (line.toLowerCase().includes('numero') || line.toLowerCase().includes('expediente'))) return; // Omitir cabecera

                    const cols = line.split(/,\s*|\t/).map(c => c.replace(/^["']|["']$/g, '').trim());
                    if (cols.length >= 4) {
                        const num = cols[0];
                        const juicio = cols[1] || 'Ordinario Burocrático';
                        const actor = cols[2];
                        const demandado = cols[3];
                        const area = cols[4] || 'Oficialía';
                        const tarea = cols[5] || 'Carga inicial desde archivo Excel';

                        const newExp = {
                            id: 'exp-' + Date.now() + '-' + Math.floor(Math.random()*1000),
                            numero: num,
                            juicio: juicio,
                            actor: actor,
                            demandado: demandado,
                            areaActual: area,
                            estadoRecepcion: 'Aceptado',
                            fechaTurno: nowStr,
                            tareaPendiente: tarea,
                            historial: [
                                { fecha: nowStr, usuario: `${currentUser.name} (${currentUser.role})`, area: area, accion: 'Ingreso masivo por plantilla Excel' }
                            ]
                        };

                        expedientes.push(newExp);
                        importedCount++;

                        if (window.isFirebaseConfigured && window.db) {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', newExp.id), newExp);
                            });
                        }
                    }
                });

                saveState();
                logAction(`Importación masiva de ${importedCount} expedientes realizada por ${currentUser.name}`);
                closeModal();
                showAlert(`Se importaron ${importedCount} expedientes correctamente.`, 'success');
                this.renderDashboard();
            },

                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', newExp.id), newExp);
                    } catch(err) { console.error("Error al registrar expediente en Firebase:", err); }
                }

                logAction(`Radicación del expediente ${num} efectuada por ${currentUser.name}`);
                closeModal();
                showAlert(`Expediente ${num} radicado exitosamente.`, 'success');
                this.renderDashboard();
            },

            // --- VISOR GENERAL DE INFORME COMPLETO ---
            renderReportModal: function() {
                const content = `
                    <div class="p-6 space-y-4 max-w-5xl w-full max-h-[92vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 class="text-xl font-serif font-bold text-slate-900 flex items-center gap-2">
                                    <i data-lucide="file-spreadsheet" class="w-6 h-6 text-amber-600"></i>
                                    Visor General de Informe y Custodia de Expedientes
                                </h3>
                                <p class="text-xs text-slate-500 font-medium">
                                    Reporte ejecutivo en tiempo real de la Ponencia Tres
                                </p>
                            </div>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-6 h-6 text-slate-400"></i></button>
                        </div>

                        <div class="flex justify-end space-x-2">
                            <button onclick="app.downloadExcelReport()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs rounded-lg shadow flex items-center gap-1.5">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                <span>Exportar a Excel (.CSV)</span>
                            </button>
                        </div>

                        <div class="border border-slate-200 rounded-xl overflow-hidden shadow bg-white">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="bg-slate-900 text-amber-300 font-bold">
                                    <tr>
                                        <th class="p-3">N° Expediente</th>
                                        <th class="p-3">Partes Contendientes</th>
                                        <th class="p-3">Área de Custodia</th>
                                        <th class="p-3">Días Hábiles</th>
                                        <th class="p-3">Acción Pendiente</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${expedientes.map(e => {
                                        const sem = calcularDiasHabilesTranscurridos(e.fechaTurno);
                                        return `
                                            <tr class="hover:bg-slate-50">
                                                <td class="p-3 font-bold text-slate-900">${e.numero}</td>
                                                <td class="p-3">${e.actor} vs ${e.demandado}</td>
                                                <td class="p-3 font-bold text-amber-800">${e.areaActual}</td>
                                                <td class="p-3">
                                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${sem.bgClass}">
                                                        ${sem.label}
                                                    </span>
                                                </td>
                                                <td class="p-3 text-slate-700">${e.tareaPendiente || 'Sin acción'}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="flex justify-end pt-2 border-t">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-900 text-amber-400 font-bold text-xs rounded-lg shadow">Cerrar Visor</button>
                        </div>
                    </div>
                `;
                openModal(content);
            },

            // --- FILTRADO INTELIGENTE DE EXPEDIENTES EN TIEMPO REAL ---
            filterExpedientes: function() {
                const query = (document.getElementById('main-search-input')?.value || '').toLowerCase().trim();
                const tbody = document.getElementById('expedientes-table-body');
                const counter = document.getElementById('exp-counter-label');

                if (!tbody) return;

                const filtered = expedientes.filter(e => 
                    (e.numero || '').toLowerCase().includes(query) ||
                    (e.actor || '').toLowerCase().includes(query) ||
                    (e.demandado || '').toLowerCase().includes(query) ||
                    (e.areaActual || '').toLowerCase().includes(query) ||
                    (e.tareaPendiente || '').toLowerCase().includes(query)
                );

                tbody.innerHTML = this.getExpedientesTableRowsHtml(filtered);
                if (counter) counter.textContent = `Mostrando ${filtered.length} de ${expedientes.length} registros`;
                lucide.createIcons();
            },

            // --- TURNADO DE UN SOLO EXPEDIENTE Y CONFIRMACIÓN DE RECEPCIÓN ---
            renderTurnarExpedienteModal: function(expId) {
                const exp = expedientes.find(e => e.id === expId);
                if (!exp) return;

                const content = `
                    <div class="p-6 space-y-4 max-w-md w-full">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="send" class="w-5 h-5 text-amber-600"></i>
                                Turnar Expediente ${exp.numero}
                            </h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>

                        <form onsubmit="app.handleSaveTurno(event, '${exp.id}')" class="space-y-3 text-xs">
                            <div>
                                <label class="font-bold text-slate-700">Área Destino:</label>
                                <select id="turno-area-destino" required class="w-full p-2.5 border-2 border-amber-400 rounded-lg font-bold text-slate-900 bg-amber-50/30">
                                    ${AREAS.filter(a => a !== exp.areaActual).map(a => `<option value="${a}">${a}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="font-bold text-slate-700">Acción / Instrucción Pendiente:</label>
                                <textarea id="turno-instruccion" rows="3" required placeholder="Instrucciones para el área receptora..." class="w-full p-2 border rounded font-sans"></textarea>
                            </div>

                            <div class="flex justify-end space-x-2 pt-2 border-t">
                                <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-slate-200 text-slate-700 font-bold rounded">Cancelar</button>
                                <button type="submit" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded shadow">Turnar Expediente</button>
                            </div>
                        </form>
                    </div>
                `;
                openModal(content);
            },

            handleSaveTurno: async function(e, expId) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === expId);
                if (!exp) return;

                const destino = document.getElementById('turno-area-destino').value;
                const instruccion = document.getElementById('turno-instruccion').value.trim();
                const nowStr = new Date().toLocaleString('es-MX');

                exp.areaActual = destino;
                exp.estadoRecepcion = 'Pendiente_Aceptacion';
                exp.fechaTurno = nowStr;
                exp.tareaPendiente = instruccion;

                if (!exp.historial) exp.historial = [];
                exp.historial.unshift({
                    fecha: nowStr,
                    usuario: `${currentUser.name} (${currentUser.role})`,
                    area: destino,
                    accion: `Turnado a ${destino}. Instrucción: ${instruccion}`
                });

                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                    } catch(err) { console.error("Error al actualizar turno en Firebase:", err); }
                }

                logAction(`Expediente ${exp.numero} turnado a ${destino} por ${currentUser.name}`);
                closeModal();
                showAlert(`Expediente ${exp.numero} turnado a ${destino}`, 'success');
                this.renderDashboard();
            },

            handleAceptarExpediente: async function(expId) {
                const exp = expedientes.find(e => e.id === expId);
                if (!exp) return;

                const nowStr = new Date().toLocaleString('es-MX');
                exp.estadoRecepcion = 'Aceptado';

                if (!exp.historial) exp.historial = [];
                exp.historial.unshift({
                    fecha: nowStr,
                    usuario: `${currentUser.name} (${currentUser.role})`,
                    area: currentUser.area,
                    accion: `Recepción física aceptada en ${currentUser.area}`
                });

                saveState();

                if (window.isFirebaseConfigured && window.db) {
                    try {
                        const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        await setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                    } catch(err) { console.error("Error al aceptar expediente en Firebase:", err); }
                }

                logAction(`Expediente ${exp.numero} recepcionado en ${currentUser.area}`);
                showAlert(`Expediente ${exp.numero} recepcionado correctamente.`, 'success');
                this.renderDashboard();
            },

            renderTrazabilidadModal: function(expId) {
                const exp = expedientes.find(e => e.id === expId);
                if (!exp) return;

                const content = `
                    <div class="p-6 space-y-4 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-lg font-serif font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="history" class="w-5 h-5 text-amber-600"></i>
                                Trazabilidad e Historial del Expediente ${exp.numero}
                            </h3>
                            <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5 text-slate-400"></i></button>
                        </div>

                        <div class="space-y-3 text-xs">
                            ${(exp.historial || []).map(h => `
                                <div class="p-3 bg-slate-50 border-l-4 border-amber-500 rounded shadow-sm space-y-1">
                                    <div class="flex justify-between text-slate-500 font-bold">
                                        <span>📅 ${h.fecha}</span>
                                        <span class="text-amber-800">${h.area}</span>
                                    </div>
                                    <div class="font-bold text-slate-900">${h.usuario}</div>
                                    <p class="text-slate-700 font-medium">${h.accion}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex justify-end pt-2 border-t">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-900 text-amber-400 font-bold text-xs rounded">Cerrar</button>
                        </div>
                    </div>
                `;
                openModal(content);
            },

            logout: function() {
                logAction(`Cierre de sesión efectuado por ${currentUser ? currentUser.name : 'Usuario'}`);
                currentUser = null;
                localStorage.removeItem('tld_current_user');
                this.renderLogin();
            }
        };

        // UI HELPER FUNCTIONS
        function openModal(contentHtml) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (container && content) {
                content.innerHTML = contentHtml;
                container.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.classList.add('hidden');
        }

        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-800 text-white' : type === 'error' ? 'bg-rose-800 text-white' : 'bg-slate-800 text-amber-300';
            toast.className = `${bg} px-4 py-3 rounded-lg shadow-2xl border border-amber-500/30 text-xs font-bold pointer-events-auto transition duration-300 transform translate-y-2`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>

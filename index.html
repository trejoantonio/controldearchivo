    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration setup
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "",
            authDomain: "",
            projectId: "default-project",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tb-ponencia3-app';

        let appFirebase = null;
        let db = null;
        let auth = null;

        if (firebaseConfig.projectId && firebaseConfig.projectId !== "default-project") {
            try {
                appFirebase = initializeApp(firebaseConfig);
                db = getFirestore(appFirebase);
                auth = getAuth(appFirebase);

                // Authentication init
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                // Attach Firebase reference to window for global access
                window.firebaseDb = db;
                window.firebaseAuth = auth;
                window.firebaseAppId = appId;
                window.firestoreCollections = {
                    publicData: (coll) => collection(db, 'artifacts', appId, 'public', 'data', coll),
                    publicDoc: (coll, id) => doc(db, 'artifacts', appId, 'public', 'data', coll, id)
                };

                console.log("Firebase initialized successfully.");
            } catch (err) {
                console.warn("Firebase initialization skipped or failed, falling back to local storage:", err);
            }
        }
    </script>

        function openModal(content) {
            const modal = document.getElementById('modal');

            modalContent.innerHTML = content;
            modal.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
        }

        function showAlert(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const bgColors = {
                success: 'bg-emerald-600 text-white border-emerald-500',
                danger: 'bg-rose-600 text-white border-rose-500',
                warning: 'bg-amber-500 text-slate-950 border-amber-400 font-semibold',
                info: 'bg-slate-800 text-slate-100 border-slate-600'
            };

            const icons = {
                success: 'check-circle-2',
                danger: 'alert-triangle',
                warning: 'alert-circle',
                info: 'info'
            };

            const toast = document.createElement('div');
            toast.className = `p-3 rounded-lg shadow-xl border ${bgColors[type] || bgColors.info} text-xs flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `
                <div class="flex items-center gap-2">
                    <i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i>
                    <span>${msg}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-xs opacity-70 hover:opacity-100 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            `;

            container.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                if (toast.parentElement) {
                    toast.remove();
                }
            }, 4000);
        }

            initFirebaseSync: function() {
                // Setup live listeners if Firebase DB is active
                if (window.firebaseDb && window.firestoreCollections) {
                    try {
                        const { onSnapshot } = window;
                        // Listen to expedientes collection in real-time
                        const expCol = window.firestoreCollections.publicData('expedientes');
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ onSnapshot }) => {
                            onSnapshot(expCol, (snapshot) => {
                                if (!snapshot.empty) {
                                    const remoteExps = [];
                                    snapshot.forEach(doc => remoteExps.push({ id: doc.id, ...doc.data() }));
                                    if (remoteExps.length > 0) {
                                        this.expedientes = remoteExps;
                                        localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                                        if (this.activeTab === 'dashboard') this.filterExpedientesTable();
                                    }
                                }
                            }, (err) => console.warn("Firestore Expedientes sync notice:", err));
                        });
                    } catch(e) {
                        console.warn("Realtime listener setup exception:", e);
                    }
                }
            },

            handleNewExpedienteSubmit: function(e) {
                e.preventDefault();
                const prefix = document.getElementById('exp_prefix').value;
                const consecutivo = document.getElementById('exp_consecutivo').value.trim();
                const anio = document.getElementById('exp_anio').value;

                const fullNumber = `${prefix}/${consecutivo.padStart(3, '0')}/${anio}`;

                if (this.expedientes.some(exp => exp.numero === fullNumber)) {
                    showAlert(`El número de expediente ${fullNumber} ya se encuentra registrado.`, 'danger');
                    return;
                }

                const actorNombre = document.getElementById('actor_nombre').value.trim();
                const actorPaterno = document.getElementById('actor_paterno').value.trim();
                const actorMaterno = document.getElementById('actor_materno').value.trim();
                const fullActor = `${actorNombre} ${actorPaterno} ${actorMaterno}`.trim();

                const demandado = document.getElementById('exp_demandado').value.trim();
                const juicio = document.getElementById('exp_juicio_tipo').value;
                const tarea = document.getElementById('exp_tarea').value.trim();
                const encargado = document.getElementById('exp_encargado').value;

                let vinculado = document.getElementById('exp_vinculado').value.trim();
                const desvincular = document.getElementById('chk_desvincular').checked;

                if (desvincular) {
                    vinculado = '';
                }

                let amparoData = null;
                if (document.getElementById('chk_has_amparo').checked) {
                    amparoData = {
                        tipo: document.getElementById('amp_tipo').value,
                        juzgado: document.getElementById('amp_juzgado').value,
                        numeroAmparo: document.getElementById('amp_numero').value.trim(),
                        fechaTerminoFatal: document.getElementById('amp_fecha_fatal').value
                    };
                }

                const nowStr = new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX');

                const newExp = {
                    id: 'exp-' + Date.now().toString(36),
                    prefix,
                    consecutivo,
                    anio,
                    numero: fullNumber,
                    actorNombre,
                    actorPaterno,
                    actorMaterno,
                    actor: fullActor,
                    demandado,
                    juicio,
                    tarea,
                    encargado,
                    fechaRegistro: nowStr,
                    expedienteVinculado: vinculado,
                    amparo: amparoData,
                    historial: [
                        {
                            fecha: nowStr,
                            usuario: this.currentUser ? this.currentUser.name : 'Admin',
                            area: encargado,
                            accion: `Registro del expediente con prefijo ${prefix}.${desvincular ? ' (Se desvinculó antecedente explícitamente)' : ''}`
                        }
                    ]
                };

                this.expedientes.unshift(newExp);
                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));

                // Sync to Firestore if available
                if (window.firebaseDb && window.firestoreCollections) {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc }) => {
                        const docRef = window.firestoreCollections.publicDoc('expedientes', newExp.id);
                        setDoc(docRef, newExp).catch(err => console.warn("Firestore save fallback:", err));
                    });
                }

                this.logAudit('Registro Expediente', `Alta del expediente ${fullNumber} - ${fullActor}`);

                showAlert(`Expediente ${fullNumber} registrado exitosamente.`, 'success');
                closeModal();
                this.renderDashboard();
            },

            handleLoginSubmit: function(e) {
                e.preventDefault();
                const uInput = document.getElementById('login_user').value.trim();
                const pInput = document.getElementById('login_pass').value.trim();

                const user = this.users.find(u => u.username.toLowerCase() === uInput.toLowerCase());

                if (!user) {
                    showAlert('El nombre de usuario especificado no existe.', 'danger');
                    return;
                }

                if (user.status === 'pendiente') {
                    showAlert('Su cuenta aún está pendiente de aprobación por el Administrador General.', 'warning');
                    return;
                }

                if (user.status === 'rechazado') {
                    showAlert('Su solicitud de acceso ha sido rechazada por la administración.', 'danger');
                    return;
                }

                if (user.passwordHash !== pInput) {
                    showAlert('Contraseña de acceso incorrecta.', 'danger');
                    return;
                }

                this.currentUser = user;
                localStorage.setItem('tb_session', JSON.stringify(user));
                this.logAudit('Inicio de Sesión', `Acceso exitoso al sistema.`);
                showAlert(`Bienvenido/a, ${user.name}`, 'success');
                this.renderDashboard();
            },

            logout: function() {
                if (this.currentUser) {
                    this.logAudit('Cierre de Sesión', 'Cierre voluntario de sesión.');
                }
                this.currentUser = null;
                localStorage.removeItem('tb_session');
                this.renderLogin();
            },

            updateActorNameAndSearch: function() {
                const nombre = document.getElementById('actor_nombre')?.value.trim() || '';

                const materno = document.getElementById('actor_materno')?.value.trim() || '';

                const searchTerms = `${nombre} ${paterno} ${materno}`.trim().toLowerCase();
                const panel = document.getElementById('live_antecedents_panel');
                const list = document.getElementById('live_antecedents_list');

                if (searchTerms.length < 3) {
                    if (panel) panel.classList.add('hidden');
                    return;
                }

                const matches = this.expedientes.filter(e => {
                    const fullActor = (e.actor || `${e.actorNombre || ''} ${e.actorPaterno || ''} ${e.actorMaterno || ''}`).toLowerCase();
                    return fullActor.includes(searchTerms) || (paterno && fullActor.includes(paterno.toLowerCase()));
                });

                if (matches.length > 0) {
                    panel.classList.remove('hidden');
                    list.innerHTML = matches.map(m => `

            processAcceptPackageSubmit: function(expIds) {
                const exps = this.expedientes.filter(e => expIds.includes(e.id));
                const user = this.currentUser;
                const nowStr = new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX');

                const reportRecord = {
                    id: 'REP-' + Date.now().toString(36),
                    fecha: nowStr,
                    servidorPublico: user.name,
                    cargo: user.role,
                    expedientes: exps.map(e => ({ numero: e.numero, juicio: e.juicio, actor: e.actor })),
                    checklist: {
                        folios: document.getElementById('chk_folios')?.checked || true,
                        anexos: document.getElementById('chk_anexos')?.checked || true,
                        estado: document.getElementById('chk_estado')?.checked || true,
                        amparos: document.getElementById('chk_amparos')?.checked || true
                    },
                    firmaDigitalHash: 'SHA256-' + Math.random().toString(36).substring(2, 12).toUpperCase()
                };

                this.reportesEntrega.unshift(reportRecord);
                localStorage.setItem('tb_reportes_entrega', JSON.stringify(this.reportesEntrega));

                exps.forEach(e => {
                    e.encargado = user.role;
                    e.tarea = 'Recibido en Custodia';
                    e.historial = e.historial || [];
                    e.historial.push({
                        fecha: nowStr,
                        usuario: user.name,
                        area: user.role,
                        accion: `Aceptación de custodia mediante firma digital. Reporte N° ${reportRecord.id}`
                    });
                });

                localStorage.setItem('tb_expedientes', JSON.stringify(this.expedientes));
                this.logAudit('Aceptación Paquete', `Firma de recepción de ${exps.length} expedientes. Reporte ${reportRecord.id}`);

                closeModal();
                showAlert(`Paquete aceptado exitosamente. Se generó el Reporte ${reportRecord.id}`, 'success');
                this.renderDashboard();
            },

            handleSendRecoveryCode: async function() {
                const userInput = document.getElementById('recovery_user_input')?.value.trim();
                if (!userInput) return;

                const user = this.users.find(u => u.username.toLowerCase() === userInput.toLowerCase() || u.email?.toLowerCase() === userInput.toLowerCase());
                if (!user) {
                    showAlert('Usuario no encontrado.', 'danger');
                    return;
                }

                const tempCode = Math.floor(100000 + Math.random() * 900000).toString();
                user.tempCode = tempCode;
                user.tempCodeExpires = Date.now() + (15 * 60 * 1000);

                localStorage.setItem('tb_users', JSON.stringify(this.users));

                if (this.emailConfig.active && this.emailConfig.serviceId) {
                    try {
                        await emailjs.send(this.emailConfig.serviceId, this.emailConfig.templateId, {
                            to_name: user.name,
                            to_email: user.email || 'usuario@durango.gob.mx',
                            code: tempCode,
                            subject: 'Código de Recuperación - Ponencia 3'
                        });
                        showAlert('Código enviado a su correo electrónico.', 'success');
                    } catch(err) {
                        console.warn('Email delivery notice:', err);
                    }
                } else {
                    showAlert(`Modo Simulación: Su clave temporal es ${tempCode}`, 'info');
                }

                document.getElementById('recovery_step1').classList.add('hidden');
                document.getElementById('recovery_step2').classList.remove('hidden');
            },

            handleVerifyAndResetPassword: function() {
                const code = document.getElementById('recovery_code_input')?.value.trim();
                const newPass = document.getElementById('recovery_new_pass')?.value.trim();

                const user = this.users.find(u => u.tempCode === code && u.tempCodeExpires > Date.now());

                if (!user) {
                    showAlert('Código inválido o expirado (duración 15 minutos).', 'danger');
                    return;
                }

                if (!newPass) {
                    showAlert('Ingrese la nueva contraseña.', 'warning');
                    return;
                }

                user.passwordHash = newPass;
                delete user.tempCode;
                delete user.tempCodeExpires;

                localStorage.setItem('tb_users', JSON.stringify(this.users));
                showAlert('Contraseña actualizada exitosamente.', 'success');
                closeModal();
            },

                    </div>
                `;
                openModal(content);
            },

            approveUser: function(userId) {
                const u = this.users.find(usr => usr.id === userId);
                if (u) {
                    u.status = 'aprobado';
                    localStorage.setItem('tb_users', JSON.stringify(this.users));
                    showAlert(`Usuario ${u.name} aprobado.`, 'success');
                    this.renderAdminPanel();
                }
            }
        };

        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>

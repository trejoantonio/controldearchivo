    <script>
        // GLOBAL INITIAL DATA & STORAGE LOGIC
        const AREAS = [

        const ROLES = [

        ];

        const DEFAULT_USERS = [
            { id: 'u1', name: 'Mtro. Juez Ponencia 3', email: 'juez3@tribunallaboraldurango.gob.mx', username: 'Juez3', password: '123', area: 'Oficina del Juez', role: 'Juez', status: 'Activo', fechaAlta: '2026-01-10', docNombramiento: 'Nombramiento_Oficial.pdf', docINE: 'INE_Juez.pdf', acuerdoAceptado: true },
            { id: 'u2', name: 'Admin General', email: 'admin@tribunallaboraldurango.gob.mx', username: 'Admin', password: '662666', area: 'Oficina del Juez', role: 'Administrador', status: 'Activo', fechaAlta: '2026-01-01', docNombramiento: 'Nombramiento_Admin.pdf', docINE: 'INE_Admin.pdf', acuerdoAceptado: true },
            { id: 'u3', name: 'Lic. María Elena Torres', email: 'acuerdos@tribunallaboraldurango.gob.mx', username: 'SecretariaAcuerdos', password: '123', area: 'Secretaría de Acuerdos', role: 'Secretaria_Acuerdos', status: 'Activo', fechaAlta: '2026-01-12', docNombramiento: 'Nombramiento_Acuerdos.pdf', docINE: 'INE_Acuerdos.pdf', acuerdoAceptado: true },
            { id: 'u4', name: 'Lic. Roberto Gómez', email: 'actuaria@tribunallaboraldurango.gob.mx', username: 'Actuario1', password: '123', area: 'Actuaría', role: 'Actuario', status: 'Activo', fechaAlta: '2026-01-15', docNombramiento: 'Nombramiento_Actuario.pdf', docINE: 'INE_Actuario.pdf', acuerdoAceptado: true }
        ];

        const DEFAULT_EXPEDIENTES = [
            {
                id: 'exp-001',
                numero: '124/2026-P3',
                juicio: 'Ordinario Laboral Burocrático',
                actor: 'Juan Carlos Morales',
                demandado: 'Secretaría de Educación del Estado de Durango',
                areaActual: 'Secretaría de Acuerdos',
                estadoRecepcion: 'Aceptado',
                fechaTurno: '2026-03-01 09:30',
                tareaPendiente: 'Revisión e integración de promoción inicial',
                historial: [
                    { fecha: '2026-03-01 09:00', usuario: 'Lic. María Elena Torres', area: 'Oficialía', accion: 'Radicación de Expediente e ingreso de promoción inicial.' },
                    { fecha: '2026-03-01 09:30', usuario: 'Lic. María Elena Torres', area: 'Secretaría de Acuerdos', accion: 'Aceptación física e inicio de trámite.' }
                ]
            }
        ];

        const DEFAULT_AUDIT_LOGS = [
            { id: 'log-1', fecha: '2026-03-01 09:00', usuario: 'Lic. María Elena Torres', accion: 'Creación de expediente N° 124/2026-P3', ip: '192.168.1.10' },
            { id: 'log-2', fecha: '2026-03-01 09:30', usuario: 'Lic. María Elena Torres', accion: 'Recepción aceptada de expediente N° 124/2026-P3', ip: '192.168.1.10' }
        ];

        // LOAD PERSISTED OR DEFAULT STATE
        let users = JSON.parse(localStorage.getItem('tld_users')) || DEFAULT_USERS;
        let expedientes = JSON.parse(localStorage.getItem('tld_expedientes')) || DEFAULT_EXPEDIENTES;
        let auditLogs = JSON.parse(localStorage.getItem('tld_audit_logs')) || DEFAULT_AUDIT_LOGS;
        let currentUser = JSON.parse(localStorage.getItem('tld_current_user')) || null;

        function saveState() {
            localStorage.setItem('tld_users', JSON.stringify(users));
            localStorage.setItem('tld_expedientes', JSON.stringify(expedientes));
            localStorage.setItem('tld_audit_logs', JSON.stringify(auditLogs));
            localStorage.setItem('tld_current_user', JSON.stringify(currentUser));
        }

        // UNEDITABLE AUDIT LOGGER
        function logAction(actionDescription) {
            const newLog = {
                id: 'log-' + Date.now(),
                fecha: new Date().toLocaleString('es-MX'),
                usuario: currentUser ? `${currentUser.name} (${currentUser.username})` : 'Sistema / Anónimo',
                accion: actionDescription,
                area: currentUser ? currentUser.area : 'N/A'
            };
            auditLogs.unshift(newLog);
            saveState();

            // Sincronización en la nube si Firebase está activo
            if (window.isFirebaseConfigured && window.db) {
                try {
                    import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                        const appId = 'ponencia-3-prod';
                        setDoc(doc(window.db, 'artifacts', appId, 'public', 'data', 'audit_logs', newLog.id), newLog);
                    });
                } catch(e) { console.error(e); }
            }
        }

        // LISTENERS EN TIEMPO REAL PARA MÚLTIPLES COMPUTADORAS
        function initRealtimeSync() {
            if (!window.isFirebaseConfigured || !window.db) return;

            try {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ collection, onSnapshot }) => {
                    const appId = 'ponencia-3-prod';

                    // Sincronización de Expedientes en vivo
                    onSnapshot(collection(window.db, 'artifacts', appId, 'public', 'data', 'expedientes'), (snapshot) => {
                        const cloudExps = [];
                        snapshot.forEach(doc => cloudExps.push(doc.data()));
                        if (cloudExps.length > 0) {
                            expedientes = cloudExps.sort((a,b) => b.id.localeCompare(a.id));
                            localStorage.setItem('tld_expedientes', JSON.stringify(expedientes));
                            if (currentUser && document.getElementById('table-expedientes')) {
                                app.filterTable();
                            }
                        }
                    }, (error) => console.log("Error sync expedientes:", error));

                    // Sincronización de Usuarios en vivo
                    onSnapshot(collection(window.db, 'artifacts', appId, 'public', 'data', 'users'), (snapshot) => {
                        const cloudUsers = [];
                        snapshot.forEach(doc => cloudUsers.push(doc.data()));
                        if (cloudUsers.length > 0) {
                            users = cloudUsers;
                            localStorage.setItem('tld_users', JSON.stringify(users));
                            if (currentUser && document.getElementById('app')) {
                                // Sincronizar notificación si hay solicitudes
                            }
                        }
                    }, (error) => console.log("Error sync usuarios:", error));
                });
            } catch (e) {
                console.error("Error al iniciar sincronización en vivo:", e);
            }
        }

        // APP CONTROLLER
        const app = {
            init: function() {
                initRealtimeSync();
                if (currentUser) {
                    this.renderDashboard();
                } else {
                    this.renderLogin();
                }
            },

            navigate: function(view) {
                if (!currentUser && view !== 'login' && view !== 'register') {
                    this.renderLogin();
                    return;
                }
                if (view === 'dashboard') this.renderDashboard();
                else if (view === 'users') this.renderAdminPanel();
                else if (view === 'audit') this.renderAuditLogModal();
                else if (view === 'profile') this.renderProfileModal();
            },

            // --- HEADER COMPONENT WITH INSTITUTIONAL SILVER DESIGN ---
            getHeaderHtml: function() {
                const pendingUsersCount = users.filter(u => u.status === 'Pendiente').length;
                const isJudgeOrAdmin = currentUser && (currentUser.role === 'Juez' || currentUser.role === 'Administrador');

                return `
                    <header class="silver-gradient text-white shadow-xl border-b border-amber-500/30 sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigate('dashboard')">
                                    <div class="w-12 h-12 bg-slate-900 border-2 border-amber-500/80 rounded-full flex items-center justify-center shadow-md">
                                        <i data-lucide="scale" class="w-6 h-6 text-amber-400"></i>
                                    </div>
                                    <div>
                                        <h1 class="font-serif font-bold text-lg md:text-xl tracking-wider text-amber-100 uppercase">
                                            Tribunal Laboral Burocrático del Estado de Durango
                                        </h1>
                                        <p class="text-xs text-slate-300 font-medium flex items-center gap-2">
                                            <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wider">Ponencia Número Tres</span>
                                            <span>• Control Digital de Expedientes</span>
                                        </p>
                                    </div>
                                </div>

                                ${currentUser ? `
                                    <div class="flex items-center space-x-3 text-xs">
                                        ${isJudgeOrAdmin && pendingUsersCount > 0 ? `
                                            <button onclick="app.renderAdminPanel()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg flex items-center space-x-1.5 shadow-md animate-pulse">
                                                <i data-lucide="user-plus" class="w-4 h-4"></i>
                                                <span>Aprobar Solicitudes (${pendingUsersCount})</span>
                                            </button>
                                        ` : ''}

                                        <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-right">
                                            <div class="font-bold text-amber-300">${currentUser.name}</div>
                                            <div class="text-slate-400 text-[11px]">${currentUser.area} (${currentUser.role})</div>
                                        </div>

                                        ${isJudgeOrAdmin ? `
                                            <button onclick="app.renderAuditLogModal()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 hover:text-white" title="Bitácora de Auditoría Global">
                                                <i data-lucide="activity" class="w-4 h-4 text-amber-400"></i>
                                            </button>
                                            <button onclick="app.renderAdminPanel()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 hover:text-white" title="Gestión de Usuarios / Solicitudes">
                                                <i data-lucide="users" class="w-4 h-4"></i>
                                            </button>
                                        ` : ''}

                                        <button onclick="app.renderProfileModal()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-slate-300 hover:text-white" title="Mi Perfil / Clave">
                                            <i data-lucide="key-round" class="w-4 h-4"></i>
                                        </button>

                                        <button onclick="app.logout()" class="p-2 bg-rose-900/80 hover:bg-rose-800 border border-rose-700 rounded-lg text-rose-200" title="Cerrar Sesión">
                                            <i data-lucide="log-out" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </header>
                `;
            },

            // --- AUTHENTICATION: LOGIN & REGISTER ---
            renderLogin: function() {
                const appDiv = document.getElementById('app');
                appDiv.innerHTML = `
                    ${this.getHeaderHtml()}
                    <div class="flex-1 flex items-center justify-center p-6 bg-slate-200">
                        <div class="bg-white max-w-md w-full rounded-2xl shadow-2xl border border-slate-300 overflow-hidden">

                                    <i data-lucide="shield-check" class="w-8 h-8 text-amber-400"></i>
                                </div>

                                    </div>
                                </div>

                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                                    <div class="relative">
                                        <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    </div>
                                </div>

                                <button type="submit" class="w-full silver-gradient text-white font-bold py-2.5 rounded-lg text-sm shadow-md hover:brightness-110 border border-amber-500/30 flex items-center justify-center space-x-2">
                                    <i data-lucide="log-in" class="w-4 h-4 text-amber-400"></i>
                                    <span>Ingresar al Sistema</span>
                                </button>

                                <div class="text-center pt-4 border-t border-slate-200">
                                    <p class="text-xs text-slate-600">¿No tienes cuenta de acceso?</p>
                                    <button type="button" onclick="app.renderRegisterModal()" class="text-amber-700 font-bold hover:underline text-xs mt-1">
                                        Registrar Solicitud de Usuario
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },

            handleLogin: function(e) {
                e.preventDefault();
                const u = document.getElementById('login-username').value.trim();
                const p = document.getElementById('login-password').value.trim();

                const user = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);

                if (!user) {
                    showAlert('Usuario o contraseña incorrectos.', 'error');
                    return;
                }

                if (user.status === 'Pendiente') {
                    showAlert('Tu usuario aún no ha sido autorizado por el Juez o Administrador.', 'error');
                    return;
                }

                currentUser = user;
                saveState();
                logAction(`Inicio de sesión exitoso en la plataforma.`);
                showAlert(`Bienvenido/a, ${user.name}`, 'success');
                this.renderDashboard();
            },

            logout: function() {
                if (currentUser) logAction(`Cierre de sesión de usuario.`);
                currentUser = null;
                saveState();
                showAlert('Sesión cerrada correctamente.');
                this.renderLogin();
            },

            // --- REGISTRATION REQUEST MODAL WITH DOCUMENTS AND RESPONSIBILITY AGREEMENT ---
            renderRegisterModal: function() {
                const html = `

                    </div>

                    <form onsubmit="app.handleRegisterSubmit(event)" class="p-6 space-y-4 overflow-y-auto">

                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Correo Electrónico Oficial</label>
                                <input type="email" id="reg-email" required placeholder="correo@ejemplo.gob.mx" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Nombre de Usuario</label>
                                <input type="text" id="reg-username" required placeholder="UsuarioAcceso" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
                                <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Área de Trabajo</label>
                                <select id="reg-area" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    ${AREAS.map(a => `<option value="${a}">${a}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Puesto / Cargo Oficial</label>
                                <select id="reg-role" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                    ${ROLES.filter(r => r.id !== 'Administrador').map(r => `<option value="${r.id}">${r.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <!-- DOCUMENT UPLOAD SECTION -->
                        <div class="bg-slate-50 p-4 border border-slate-200 rounded-xl space-y-3">
                            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-800 flex items-center gap-1.5">
                                <i data-lucide="file-check" class="w-4 h-4 text-amber-600"></i>
                                <span>Carga de Documentación Obligatoria</span>
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">1. Nombramiento Oficial (PDF)</label>
                                    <input type="file" id="reg-doc-nombramiento" required accept=".pdf,image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300">
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">2. Identificación Oficial - INE (PDF)</label>
                                    <input type="file" id="reg-doc-ine" required accept=".pdf,image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300">
                                </div>
                            </div>
                        </div>

                        <!-- RESPONSIBILITY AGREEMENT -->
                        <div class="bg-amber-50 border border-amber-300 p-3.5 rounded-xl text-xs text-slate-800 space-y-2">
                            <div class="font-bold text-amber-900 flex items-center gap-1.5">
                                <i data-lucide="shield-check" class="w-4 h-4 text-amber-700"></i>
                                <span>Acuerdo de Confidencialidad y Uso Responsable</span>
                            </div>

                const u = users.find(x => x.id === id);

                if (u) logAction(`Solicitud de alta rechazada y descartada para ${u.username}.`);

                this.renderAdminPanel();

                const u = users.find(x => x.id === id);
                if (!u) return;

                if (confirm(`¿Confirma dar de baja al usuario ${u.name}? Se revocará de inmediato su acceso al sistema por término de labores.`)) {
                    users = users.filter(x => x.id !== id);
                    saveState();
                    logAction(`Baja de labores ejecutada para el usuario ${u.name} (${u.username}).`);
                    showAlert(`Usuario ${u.name} dado de baja exitosamente.`, 'success');

                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Juicio / Procedimiento</label>
                                <input type="text" id="exp-juicio" required placeholder="Ej. Ordinario Burocrático" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Parte Actora / Promovente</label>
                                <input type="text" id="exp-actor" required placeholder="Nombre completo" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Demandado / Autoridad Responsable</label>
                                <input type="text" id="exp-demandado" required placeholder="Dependencia o entidad" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Sintesis de la Promoción / Tarea Inicial</label>
                            <textarea id="exp-tarea" required rows="2" placeholder="Describa la promoción de entrada o actuación requerida..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500"></textarea>
                        </div>

                        <div class="flex justify-end space-x-2 pt-2 border-t">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded-lg text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-amber-300 font-bold rounded-lg text-sm shadow">Registrar Expediente</button>
                        </div>
                    </form>
                `;
                openModal(html);
            },

            handleSaveNuevoExpediente: function(e) {
                e.preventDefault();
                const now = new Date().toLocaleString('es-MX');

                const newExp = {
                    id: 'exp-' + Date.now(),
                    numero: document.getElementById('exp-numero').value.trim(),
                    juicio: document.getElementById('exp-juicio').value.trim(),
                    actor: document.getElementById('exp-actor').value.trim(),
                    demandado: document.getElementById('exp-demandado').value.trim(),
                    areaActual: currentUser.area,
                    estadoRecepcion: 'Aceptado',
                    fechaTurno: now,
                    tareaPendiente: document.getElementById('exp-tarea').value.trim(),
                    historial: [
                        {
                            fecha: now,
                            usuario: currentUser.name,
                            area: currentUser.area,
                            accion: `Alta de expediente e ingreso de promoción inicial: ${document.getElementById('exp-tarea').value.trim()}`
                        }
                    ]
                };

                expedientes.unshift(newExp);
                saveState();

                // Guardar en la nube Firebase
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                            setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', newExp.id), newExp);
                        });
                    } catch(err) { console.error(err); }
                }

                logAction(`Creación de expediente N° ${newExp.numero} (${newExp.juicio}).`);
                closeModal();
                showAlert('Expediente registrado en la base de datos global.', 'success');
                this.renderDashboard();
            },

            // --- ACEPTAR RECEPCIÓN DE EXPEDIENTE ---
            aceptarRecepcionExpediente: function(id) {
                const exp = expedientes.find(e => e.id === id);
                if (exp) {
                    const now = new Date().toLocaleString('es-MX');
                    exp.estadoRecepcion = 'Aceptado';
                    exp.historial.unshift({
                        fecha: now,
                        usuario: currentUser.name,
                        area: currentUser.area,
                        accion: `Recepción y aceptación física del expediente en el área de ${currentUser.area}.`
                    });
                    saveState();

                    // Actualizar en Firebase
                    if (window.isFirebaseConfigured && window.db) {
                        try {
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                                setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                            });
                        } catch(err) { console.error(err); }
                    }

                    logAction(`Aceptación de recepción física de expediente N° ${exp.numero} en área ${currentUser.area}.`);
                    showAlert(`Expediente ${exp.numero} recibido correctamente en ${currentUser.area}.`, 'success');
                    this.renderDashboard();
                }
            },

            // --- TURNAR EXPEDIENTE ---
            handleSaveTurno: function(e, id) {
                e.preventDefault();
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const areaDestino = document.getElementById('turno-area').value;
                const tarea = document.getElementById('turno-tarea').value.trim();
                const now = new Date().toLocaleString('es-MX');

                exp.areaActual = areaDestino;
                exp.estadoRecepcion = 'Pendiente_Aceptacion';
                exp.fechaTurno = now;
                exp.tareaPendiente = tarea;

                exp.historial.unshift({
                    fecha: now,
                    usuario: currentUser.name,
                    area: currentUser.area,
                    accion: `Turnado a [${areaDestino}]. Indicación: ${tarea}`
                });

                saveState();

                // Actualizar en Firebase para sincronización entre dispositivos
                if (window.isFirebaseConfigured && window.db) {
                    try {
                        import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                            setDoc(doc(window.db, 'artifacts', 'ponencia-3-prod', 'public', 'data', 'expedientes', exp.id), exp);
                        });
                    } catch(err) { console.error(err); }
                }

                logAction(`Turno de expediente N° ${exp.numero} hacia el área ${areaDestino}.`);
                closeModal();
                showAlert(`Expediente turnado a ${areaDestino}.`, 'success');
                this.renderDashboard();
            },

            // --- VER HISTORIAL Y TRAZABILIDAD (UNEDITABLE) ---
            verDetalleExpediente: function(id) {
                const exp = expedientes.find(x => x.id === id);
                if (!exp) return;

                const html = `
                    <div class="silver-gradient p-4 text-white flex justify-between items-center border-b border-amber-500/40">
                        <div>
                            <h3 class="font-bold text-base font-serif">${exp.numero}</h3>
                            <p class="text-xs text-amber-300 font-sans">${exp.juicio}</p>
                        </div>
                        <button onclick="closeModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-2 gap-2 text-xs">
                            <div><span class="font-bold text-slate-700">Actor:</span> ${exp.actor}</div>
                            <div><span class="font-bold text-slate-700">Demandado:</span> ${exp.demandado}</div>
                            <div><span class="font-bold text-slate-700">Ubicación Actual:</span> <span class="text-amber-700 font-bold">${exp.areaActual}</span></div>
                            <div><span class="font-bold text-slate-700">Estatus:</span> ${exp.estadoRecepcion}</div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center border-b pb-1 mb-3">
                                <h4 class="font-bold text-xs uppercase tracking-wider text-slate-700">Trazabilidad Inalterable del Expediente</h4>
                                <span class="text-[10px] text-slate-500 font-semibold flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3 text-amber-600"></i> Historial protegido</span>
                            </div>
                            <div class="space-y-3 relative pl-4 border-l-2 border-slate-300">
                                ${exp.historial.map(h => `
                                    <div class="relative group">
                                        <div class="w-2.5 h-2.5 bg-amber-500 rounded-full absolute -left-[21px] top-1 border border-white"></div>
                                        <div class="text-[11px] text-slate-500 font-semibold">${h.fecha} • <span class="text-slate-800 font-bold">${h.usuario}</span> (${h.area})</div>
                                        <div class="text-xs text-slate-700 mt-0.5 bg-slate-100 p-2 rounded border border-slate-200">${h.accion}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-slate-100 text-right border-t">
                        <button onclick="closeModal()" class="px-4 py-1.5 bg-slate-800 text-white rounded text-xs font-bold">Cerrar</button>
                    </div>
                `;
                openModal(html);
            }
        };

        // RUN APPLICATION ON LOAD
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
